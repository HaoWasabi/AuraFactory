version: "3.9"

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: aurafactory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurafactory
      POSTGRES_USER: aurafactory
      POSTGRES_PASSWORD: aurafactory123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurafactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AuraFactory Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurafactory-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aurafactory:aurafactory123@postgres:5432/aurafactory
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:
    driver: local
