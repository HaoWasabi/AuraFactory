# docker-compose.yml — AuraFactory Development Environment
# NOTE: Requires .env file with POSTGRES_PASSWORD set
version: "3.9"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: aurafactory-db
    environment:
      POSTGRES_DB: aurafactory
      POSTGRES_USER: aurafactory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurafactory"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Application ===
  app:
    build: .
    container_name: aurafactory-app
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
