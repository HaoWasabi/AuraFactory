<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFactory</title>
    <meta http-equiv="refresh" content="0;url=/dashboard">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }
        p {
            color: #a0aec0;
            margin-bottom: 20px;
        }
        a {
            color: #5865F2;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 24px;
            border: 1px solid #5865F2;
            border-radius: 8px;
            transition: all 0.2s;
        }
        a:hover {
            background: #5865F2;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AuraFactory</h1>
        <p>AI-Powered Discord Server Management</p>
        <p>Đang chuyển hướng đến dashboard...</p>
        <a href="/dashboard">Vào Dashboard →</a>
    </div>
    <script>
        // Fallback redirect if meta refresh doesn't work
        window.location.href = '/dashboard';
    </script>
</body>
</html>
