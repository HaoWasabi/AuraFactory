<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraFactory</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:16px;padding:48px 40px;text-align:center;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.card h1{font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.card p{font-size:14px;color:var(--text-secondary);margin-bottom:32px}
.btn-login{display:inline-flex;align-items:center;gap:10px;background:#5865F2;color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;text-decoration:none}
.btn-login:hover{background:#4752c4}
.btn-login svg{width:22px;height:22px;fill:#fff}
.brand{font-size:12px;color:var(--text-muted);margin-top:24px}
.lang-btn{position:fixed;top:16px;right:16px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:6px;color:var(--text-secondary);padding:5px 12px;font-size:12px;cursor:pointer}
.lang-btn:hover{background:var(--accent-primary);color:#fff}
</style>
</head>
<body>
<button class="lang-btn" id="langBtn" onclick="toggleLang()">VI</button>
<div class="card">
  <h1 id="title">Sign in with Discord</h1>
  <p id="desc">Manage your Discord server with AI</p>
  <button class="btn-login" onclick="doLogin()">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03z"/></svg>
    <span id="loginBtn">Continue with Discord</span>
  </button>
  <p class="brand">AuraFactory</p>
</div>
<script>
var lang=localStorage.getItem('lang')||'en';
var texts={
  en:{title:'Sign in with Discord',desc:'Manage your Discord server with AI',btn:'Continue with Discord',toggle:'VI'},
  vi:{title:'Dang nhap voi Discord',desc:'Quan ly server Discord bang AI',btn:'Tiep tuc voi Discord',toggle:'EN'}
};
function render(){
  var t=texts[lang];
  document.getElementById('title').textContent=t.title;
  document.getElementById('desc').textContent=t.desc;
  document.getElementById('loginBtn').textContent=t.btn;
  document.getElementById('langBtn').textContent=t.toggle;
}
function toggleLang(){lang=lang==='en'?'vi':'en';localStorage.setItem('lang',lang);render();}
function doLogin(){
  fetch('/api/auth/login')
    .then(function(r){return r.json()})
    .then(function(d){if(d.url)window.location.href=d.url;})
    .catch(function(){alert('Login failed');});
}
render();
</script>
</body>
</html>
