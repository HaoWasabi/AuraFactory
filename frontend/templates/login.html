<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFactory — Sign In</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .login-card { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:48px 40px; text-align:center; width:100%; max-width:380px; box-shadow:var(--shadow-lg); }
    .login-title { font-size:22px; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
    .login-desc { font-size:14px; color:var(--text-secondary); margin-bottom:32px; }
    .btn-discord { display:inline-flex; align-items:center; gap:10px; background:#5865F2; color:#fff; border:none; border-radius:var(--radius-sm); padding:12px 28px; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s ease; text-decoration:none; }
    .btn-discord:hover { background:#4752c4; }
    .btn-discord svg { width:22px; height:22px; fill:#fff; }
    .lang-toggle { position:fixed; top:16px; right:16px; background:var(--bg-tertiary); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:var(--text-secondary); padding:5px 12px; font-size:12px; cursor:pointer; transition:var(--transition); }
    .lang-toggle:hover { background:var(--accent-primary); color:#fff; }
    .brand { font-size:12px; color:var(--text-muted); margin-top:24px; }
    </style>
</head>
<body>
    <button class="lang-toggle" id="langBtn" onclick="toggleLang()">VI</button>
    <div class="login-card">
        <h1 class="login-title" data-i18n="login_title">Sign in with Discord</h1>
        <p class="login-desc" data-i18n="login_desc">Manage your Discord server with AI</p>
        <a class="btn-discord" href="#" id="loginBtn" onclick="doLogin(event)">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
            <span data-i18n="login_btn">Continue with Discord</span>
        </a>
        <p class="brand">AuraFactory</p>
    </div>
    <script>
    const I18N={en:{login_title:"Sign in with Discord",login_desc:"Manage your Discord server with AI",login_btn:"Continue with Discord",lang_toggle:"VI"},vi:{login_title:"Dang nhap bang Discord",login_desc:"Quan ly server Discord bang AI",login_btn:"Tiep tuc voi Discord",lang_toggle:"EN"}};
    let lang=localStorage.getItem('lang')||'en';
    function applyLang(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[lang][k])el.textContent=I18N[lang][k]});document.getElementById('langBtn').textContent=I18N[lang].lang_toggle}
    function toggleLang(){lang=lang==='en'?'vi':'en';localStorage.setItem('lang',lang);applyLang()}
    applyLang();
    function doLogin(e){
      e.preventDefault();
      fetch('/api/auth/login').then(function(r){return r.json()}).then(function(d){
        if(d.url)window.location.href=d.url;
      }).catch(function(){alert('Login failed')});
    }
    </script>
</body>
</html>
