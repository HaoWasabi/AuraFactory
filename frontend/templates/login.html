<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFactory — Đăng nhập</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-orbs::before,
        .bg-orbs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
        }

        .bg-orbs::before {
            width: 400px;
            height: 400px;
            background: #5865F2;
            top: -100px;
            right: -100px;
        }

        .bg-orbs::after {
            width: 350px;
            height: 350px;
            background: #0f3460;
            bottom: -80px;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #16213e;
            border: 1px solid rgba(88, 101, 242, 0.2);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
                        0 0 40px rgba(88, 101, 242, 0.05);
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #5865F2, #0f3460);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 24px rgba(88, 101, 242, 0.3);
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .description {
            font-size: 15px;
            color: #8892b0;
            margin-bottom: 36px;
            line-height: 1.5;
            padding: 12px 16px;
            background: rgba(15, 52, 96, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(15, 52, 96, 0.5);
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 24px;
            background: #5865F2;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        .discord-btn:active {
            transform: translateY(0);
        }

        .discord-btn svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .features {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #8892b0;
            text-align: left;
        }

        .feature-item .icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(88, 101, 242, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .footer {
            position: relative;
            z-index: 1;
            margin-top: 32px;
            font-size: 13px;
            color: #4a5568;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orbs"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">A</div>
            <h1 class="title">AuraFactory</h1>
            <p class="subtitle">AI-Powered Discord Server Management</p>
            <p class="description">🤖 Tự động hoá setup & quản lý Discord server qua ngôn ngữ tự nhiên</p>

            <a href="#" onclick="startLogin()" class="discord-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                Đăng nhập với Discord
            </a>

            <div class="features">
                <div class="feature-item">
                    <span class="icon">⚡</span>
                    <span>Quản lý server bằng ngôn ngữ tự nhiên</span>
                </div>
                <div class="feature-item">
                    <span class="icon">🛡️</span>
                    <span>Hệ thống phê duyệt an toàn</span>
                </div>
                <div class="feature-item">
                    <span class="icon">🧠</span>
                    <span>AI hiểu ngữ cảnh server của bạn</span>
                </div>
            </div>
        </div>
    </div>

    <p class="footer">Built with ❤️ for AWS AABW 2026</p>

    <script>
        async function startLogin() {
            try {
                const resp = await fetch('/api/auth/login');
                const data = await resp.json();
                if (data.url) {
                    localStorage.setItem('aura_oauth_state', data.state);
                    window.location.href = data.url;
                }
            } catch (e) {
                alert('Không thể kết nối server. Hãy đảm bảo app đang chạy.');
            }
        }
    </script>
</body>
</html>
