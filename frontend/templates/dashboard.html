<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFactory — Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="dashboard-page">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">AuraFactory</h2>
                <button class="sidebar-close" id="sidebar-close" aria-label="Đóng sidebar">✕</button>
            </div>

            <!-- User Info -->
            <div class="user-info" id="user-info">
                <div class="user-avatar" id="user-avatar"></div>
                <span class="user-name" id="user-name">Đang tải...</span>
            </div>

            <!-- Guild Selector -->
            <div class="guild-selector">
                <label for="guild-select">Server:</label>
                <select id="guild-select" class="guild-select">
                    <option value="">Chọn server...</option>
                </select>
            </div>

            <!-- Guild Info -->
            <div class="guild-info" id="guild-info" style="display:none;">
                <div class="info-item">
                    <span class="info-label">Channels:</span>
                    <span class="info-value" id="info-channels">—</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Roles:</span>
                    <span class="info-value" id="info-roles">—</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Trạng thái:</span>
                    <span class="info-value" id="info-status">—</span>
                </div>
            </div>

            <!-- Nav -->
            <nav class="sidebar-nav">
                <a href="/auth/logout" class="nav-link logout-link">🚪 Đăng xuất</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar (mobile) -->
            <header class="top-bar">
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Mở sidebar">☰</button>
                <h1 class="page-title">Chat</h1>
                <button class="approvals-toggle" id="approvals-toggle" aria-label="Phê duyệt">
                    🔔 <span class="badge" id="approval-badge" style="display:none;">0</span>
                </button>
            </header>

            <!-- Chat Area -->
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <div class="message-text">
                                Xin chào! Tôi là AuraFactory. Tôi có thể giúp bạn quản lý Discord server. Hãy hỏi tôi bất cứ điều gì!
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typing-indicator" style="display:none;">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-text">AuraFactory đang xử lý...</span>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area">
                    <textarea
                        id="chat-input"
                        class="chat-input"
                        placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="send-btn" aria-label="Gửi">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Approvals Panel -->
        <aside class="approvals-panel" id="approvals-panel">
            <div class="panel-header">
                <h3>Phê duyệt chờ xử lý</h3>
                <button class="panel-close" id="panel-close" aria-label="Đóng">✕</button>
            </div>
            <div class="approvals-list" id="approvals-list">
                <div class="empty-state">
                    <p>Không có yêu cầu phê duyệt nào.</p>
                </div>
            </div>
        </aside>
    </div>

    <script>
    // ================================================================
    // AuraFactory Dashboard JS
    // ================================================================

    const API_BASE = '/api/v1';
    let currentGuildId = null;
    let pollInterval = null;

    // ---- Init ----
    document.addEventListener('DOMContentLoaded', async () => {
        await loadUserInfo();
        setupEventListeners();
        startApprovalPolling();
    });

    // ---- User Info ----
    async function loadUserInfo() {
        try {
            const res = await fetch('/auth/me');
            if (!res.ok) { window.location.href = '/'; return; }
            const data = await res.json();

            document.getElementById('user-name').textContent = data.username;
            if (data.avatar) {
                document.getElementById('user-avatar').innerHTML =
                    `<img src="https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png?size=64" alt="Avatar">`;
            } else {
                document.getElementById('user-avatar').textContent = data.username[0].toUpperCase();
            }

            // Populate guild selector
            const select = document.getElementById('guild-select');
            select.innerHTML = '';
            if (data.guilds && data.guilds.length > 0) {
                data.guilds.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = g.name;
                    select.appendChild(opt);
                });
                currentGuildId = parseInt(data.guilds[0].id);
                select.value = data.guilds[0].id;
                loadGuildInfo(currentGuildId);
            }
        } catch (e) {
            console.error('Failed to load user info:', e);
        }
    }

    // ---- Guild Info ----
    async function loadGuildInfo(guildId) {
        try {
            const res = await fetch(`/knowledge/${guildId}`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.data) {
                document.getElementById('guild-info').style.display = 'block';
                document.getElementById('info-channels').textContent = data.data.channels || '—';
                document.getElementById('info-roles').textContent = data.data.roles || '—';
                document.getElementById('info-status').textContent =
                    data.data.setup_complete ? '✅ Sẵn sàng' : '⏳ Chưa thiết lập';
            }
        } catch (e) {
            console.error('Failed to load guild info:', e);
        }
    }

    // ---- Event Listeners ----
    function setupEventListeners() {
        // Send message
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        const input = document.getElementById('chat-input');
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // Guild selector
        document.getElementById('guild-select').addEventListener('change', (e) => {
            currentGuildId = parseInt(e.target.value) || null;
            if (currentGuildId) loadGuildInfo(currentGuildId);
        });

        // Sidebar toggle (mobile)
        document.getElementById('sidebar-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.getElementById('sidebar-close').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
        });

        // Approvals panel toggle
        document.getElementById('approvals-toggle').addEventListener('click', () => {
            document.getElementById('approvals-panel').classList.toggle('open');
        });
        document.getElementById('panel-close').addEventListener('click', () => {
            document.getElementById('approvals-panel').classList.remove('open');
        });
    }

    // ---- Send Message ----
    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        // Add user message to chat
        appendMessage(text, 'user');
        input.value = '';
        input.style.height = 'auto';

        // Show typing
        showTyping(true);

        try {
            const res = await fetch(`${API_BASE}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    guild_id: currentGuildId,
                }),
            });

            showTyping(false);

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                appendMessage(`⚠️ Lỗi: ${err.detail || 'Không thể xử lý'}`, 'bot', true);
                return;
            }

            const data = await res.json();
            appendMessage(data.content, 'bot');
        } catch (e) {
            showTyping(false);
            appendMessage('⚠️ Lỗi kết nối. Vui lòng thử lại.', 'bot', true);
        }
    }

    // ---- Append Message ----
    function appendMessage(content, sender, isError = false) {
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-message${isError ? ' error' : ''}`;

        const avatar = sender === 'bot' ? '🤖' : '👤';
        let rendered = content;
        if (sender === 'bot' && typeof marked !== 'undefined') {
            try { rendered = marked.parse(content); } catch(e) { rendered = content; }
        }

        msgDiv.innerHTML = `
            <div class="message-avatar">${avatar}</div>
            <div class="message-content">
                <div class="message-text">${sender === 'bot' ? rendered : escapeHtml(content)}</div>
            </div>
        `;

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    // ---- Typing Indicator ----
    function showTyping(show) {
        document.getElementById('typing-indicator').style.display = show ? 'flex' : 'none';
    }

    // ---- Approvals Polling ----
    function startApprovalPolling() {
        pollApprovals();
        pollInterval = setInterval(pollApprovals, 3000);
    }

    async function pollApprovals() {
        try {
            const params = currentGuildId ? `?guild_id=${currentGuildId}` : '';
            const res = await fetch(`${API_BASE}/approvals${params}`);
            if (!res.ok) return;

            const data = await res.json();
            renderApprovals(data.approvals || []);

            // Update badge
            const badge = document.getElementById('approval-badge');
            if (data.count > 0) {
                badge.textContent = data.count;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        } catch (e) {
            // Silently fail polling
        }
    }

    function renderApprovals(approvals) {
        const list = document.getElementById('approvals-list');
        if (approvals.length === 0) {
            list.innerHTML = '<div class="empty-state"><p>Không có yêu cầu phê duyệt nào.</p></div>';
            return;
        }

        list.innerHTML = approvals.map(a => `
            <div class="approval-item risk-${a.risk_level.toLowerCase()}">
                <div class="approval-header">
                    <span class="approval-action">${escapeHtml(a.action)}</span>
                    <span class="risk-badge ${a.risk_level.toLowerCase()}">${a.risk_level}</span>
                </div>
                <p class="approval-desc">${escapeHtml(a.description)}</p>
                ${a.steps.length > 0 ? `
                    <ul class="approval-steps">
                        ${a.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
                    </ul>
                ` : ''}
                <div class="approval-actions">
                    <button class="btn-approve" onclick="approveAction('${a.id}')">✅ Phê duyệt</button>
                    <button class="btn-reject" onclick="rejectAction('${a.id}')">❌ Từ chối</button>
                </div>
            </div>
        `).join('');
    }

    // ---- Approve / Reject ----
    async function approveAction(id) {
        try {
            const res = await fetch(`${API_BASE}/approve/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                appendMessage(`✅ Đã phê duyệt: ${data.message}`, 'bot');
                pollApprovals();
            } else {
                appendMessage(`⚠️ ${data.message}`, 'bot', true);
            }
        } catch (e) {
            appendMessage('⚠️ Lỗi khi phê duyệt.', 'bot', true);
        }
    }

    async function rejectAction(id) {
        try {
            const res = await fetch(`${API_BASE}/reject/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                appendMessage(`❌ Đã từ chối: ${data.message}`, 'bot');
                pollApprovals();
            } else {
                appendMessage(`⚠️ ${data.message}`, 'bot', true);
            }
        } catch (e) {
            appendMessage('⚠️ Lỗi khi từ chối.', 'bot', true);
        }
    }

    // ---- Utils ----
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    </script>
</body>
</html>
