<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraFactory</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.app-layout{display:flex;flex-direction:column;height:100vh}
/* Navbar */
.navbar{display:flex;align-items:center;justify-content:space-between;height:var(--navbar-height);padding:0 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color)}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-logo{width:32px;height:32px;border-radius:50%;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.nav-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.guild-select{background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);padding:5px 10px;font-size:13px;min-width:170px}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-avatar{width:28px;height:28px;border-radius:50%}
.nav-user{font-size:12px;color:var(--text-secondary)}
.btn-sm{background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-secondary);padding:4px 10px;font-size:12px;cursor:pointer;transition:var(--transition)}
.btn-sm:hover{background:var(--accent-primary);color:#fff}
/* Content */
.content-area{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:var(--sidebar-width);background:var(--bg-panel);border-right:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden}
.sidebar-hdr{padding:10px 12px;border-bottom:1px solid var(--border-subtle)}
.btn-new{width:100%;padding:7px;background:var(--accent-primary);border:none;border-radius:var(--radius-sm);color:#fff;font-size:13px;cursor:pointer;font-weight:500;transition:var(--transition)}
.btn-new:hover{background:var(--accent-hover)}
.session-list{flex:1;overflow-y:auto;padding:6px 8px}
.session-group{font-size:11px;color:var(--text-muted);text-transform:uppercase;padding:8px 4px 4px;letter-spacing:.4px}
.session-item{padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .12s}
.session-item:hover{background:var(--bg-hover)}
.session-item.active{background:var(--accent-primary);color:#fff}
.sidebar-section{padding:10px 12px;border-top:1px solid var(--border-subtle)}
.sidebar-section-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.info-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.info-label{color:var(--text-secondary)}
.info-value{color:var(--text-primary);font-weight:500}
.admin-input{width:100%;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;padding:5px 8px;margin-top:4px}
.btn-admin{width:100%;margin-top:6px;padding:6px;background:var(--accent-primary);border:none;border-radius:var(--radius-sm);color:#fff;font-size:12px;cursor:pointer}
/* Chat */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-messages{flex:1;overflow-y:auto;padding:16px;transition:opacity .12s}
.chat-messages.loading{opacity:.4}
.msg{margin-bottom:12px;display:flex}
.msg-user{justify-content:flex-end}
.msg-bot{justify-content:flex-start}
.msg-bubble{max-width:70%;padding:10px 14px;border-radius:var(--radius-md);font-size:13px;line-height:1.6}
.msg-user .msg-bubble{background:var(--chat-user);color:#fff;border-bottom-right-radius:4px}
.msg-bot .msg-bubble{background:var(--chat-bot);color:var(--text-primary);border-bottom-left-radius:4px}
.msg-bot .msg-bubble p{margin:0 0 6px}
.msg-bot .msg-bubble p:last-child{margin:0}
.msg-bot .msg-bubble code{background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px;font-size:12px}
.msg-bot .msg-bubble pre{background:rgba(0,0,0,.3);padding:8px;border-radius:var(--radius-sm);overflow-x:auto;margin:6px 0}
/* Cards */
.approval-card,.clarify-card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-md);padding:12px;margin:8px 0}
.card-title{font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px}
.plan-step{font-size:12px;color:var(--text-secondary);padding:2px 0 2px 10px;border-left:2px solid var(--border-color)}
.risk-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin:6px 0}
.risk-low{background:rgba(34,197,94,.15);color:var(--risk-low)}
.risk-medium{background:rgba(234,179,8,.15);color:var(--risk-medium)}
.risk-high{background:rgba(249,115,22,.15);color:var(--risk-high)}
.risk-critical{background:rgba(239,68,68,.15);color:var(--risk-critical)}
.card-actions{display:flex;gap:8px;margin-top:8px}
.btn-approve{background:var(--success);color:#fff;border:none;border-radius:var(--radius-sm);padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:var(--transition)}
.btn-approve:hover{filter:brightness(1.1)}
.btn-reject{background:var(--danger);color:#fff;border:none;border-radius:var(--radius-sm);padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:var(--transition)}
.btn-reject:hover{filter:brightness(1.1)}
.clarify-list{margin:4px 0 0 16px;font-size:12px;color:var(--text-secondary);line-height:1.7}
.status-indicator{font-size:12px;color:var(--text-muted);padding:6px 14px;font-style:italic}
/* Input */
.chat-input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border-color);background:var(--bg-secondary)}
.chat-input{flex:1;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);padding:9px 12px;font-size:13px;resize:none;min-height:38px;max-height:120px;font-family:inherit}
.chat-input:focus{outline:none;border-color:var(--accent-primary)}
.btn-send{background:var(--accent-primary);border:none;border-radius:var(--radius-sm);color:#fff;padding:0 16px;font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition)}
.btn-send:hover{background:var(--accent-hover)}
/* Right Panel */
.right-panel{width:300px;background:var(--bg-panel);border-left:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease}
.right-panel.collapsed{width:0;border:none}
.panel-tabs{display:flex;border-bottom:1px solid var(--border-subtle)}
.panel-tab{flex:1;padding:8px;text-align:center;font-size:12px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
.panel-tab.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary)}
.panel-content{flex:1;overflow-y:auto;padding:10px}
.panel-content[hidden]{display:none}
.tree-item{font-size:12px;padding:3px 0 3px 8px;color:var(--text-secondary)}
.tree-cat{font-weight:600;color:var(--text-primary);padding:5px 0 2px}
.tree-icon{display:inline-block;width:16px;color:var(--text-muted);font-size:11px}
.audit-entry{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border-subtle)}
.audit-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.audit-dot.ok{background:var(--success)}
.audit-dot.fail{background:var(--danger)}
.audit-tool{color:var(--text-primary);flex:1}
.audit-time{color:var(--text-muted);font-size:11px}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:13px}
</style>
</head>
<body>
<div class="app-layout">
<!-- Navbar -->
<nav class="navbar">
  <div class="nav-left">
    <div class="nav-logo">A</div>
    <span class="nav-title">AuraFactory</span>
    <select class="guild-select" id="guildSelect" onchange="selectGuild(this.value)">
      <option value="" data-i18n="select_server">Select server...</option>
    </select>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <img class="nav-avatar" id="navAvatar" src="" alt="" onerror="this.style.display='none'">
    <button class="btn-sm" id="langBtn" onclick="toggleLang()">VI</button>
    <button class="btn-sm" data-i18n="logout" onclick="logout()">Log out</button>
  </div>
</nav>
<!-- Content -->
<div class="content-area">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-hdr">
      <button class="btn-new" data-i18n="new_chat" onclick="newChat()">New Chat</button>
    </div>
    <div class="session-list" id="sessionList">
      <div class="empty-state" data-i18n="no_sessions">No conversations yet</div>
    </div>
    <!-- Server Info -->
    <div class="sidebar-section">
      <div class="sidebar-section-title" data-i18n="server_info">Server Info</div>
      <div class="info-row"><span class="info-label" data-i18n="channels">Channels</span><span class="info-value" id="infoChannels">--</span></div>
      <div class="info-row"><span class="info-label" data-i18n="roles">Roles</span><span class="info-value" id="infoRoles">--</span></div>
      <div class="info-row"><span class="info-label" data-i18n="members">Members</span><span class="info-value" id="infoMembers">--</span></div>
    </div>
    <!-- Admin Panel -->
    <div class="sidebar-section" id="adminSection" style="display:none">
      <div class="sidebar-section-title" data-i18n="admin_panel">Admin Panel</div>
      <input type="password" class="admin-input" id="adminKeyInput" placeholder="Gemini API Key..." autocomplete="off">
      <button class="btn-admin" data-i18n="update_key" onclick="updateKey()">Update API Key</button>
    </div>
  </aside>
  <!-- Chat Area -->
  <main class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="empty-state" data-i18n="no_sessions">No conversations yet</div>
    </div>
    <div class="chat-input-bar">
      <textarea class="chat-input" id="chatInput" data-i18n="type_message" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="btn-send" data-i18n="send" onclick="sendMessage()">Send</button>
    </div>
  </main>
  <!-- Right Panel -->
  <aside class="right-panel" id="rightPanel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-i18n="structure" onclick="switchTab('structure')">Structure</div>
      <div class="panel-tab" data-i18n="audit_log" onclick="switchTab('audit')">Audit Log</div>
    </div>
    <div class="panel-content" id="tabStructure">
      <div class="empty-state" data-i18n="loading">Loading...</div>
    </div>
    <div class="panel-content" id="tabAudit" hidden>
      <div class="empty-state" data-i18n="loading">Loading...</div>
    </div>
  </aside>
</div>
</div>
<script>
// === i18n ===
const I18N={en:{new_chat:"New Chat",sessions:"Sessions",today:"Today",yesterday:"Yesterday",this_week:"This Week",earlier:"Earlier",server_info:"Server Info",channels:"Channels",roles:"Roles",members:"Members",structure:"Structure",audit_log:"Audit Log",send:"Send",approve:"Approve",reject:"Reject",logout:"Log out",select_server:"Select server...",admin_panel:"Admin Panel",update_key:"Update API Key",no_sessions:"No conversations yet",type_message:"Type a message...",pending_approval:"Pending Approval",plan_steps:"steps",risk_level:"Risk",clarify_title:"Need more information",loading:"Loading...",lang_toggle:"VI"},vi:{new_chat:"Cuộc trò chuyện mới",sessions:"Lịch sử",today:"Hôm nay",yesterday:"Hôm qua",this_week:"Tuần này",earlier:"Trước đó",server_info:"Thông tin Server",channels:"Kênh",roles:"Vai trò",members:"Thành viên",structure:"Cấu trúc",audit_log:"Nhật ký",send:"Gửi",approve:"Duyệt",reject:"Từ chối",logout:"Đăng xuất",select_server:"Chọn server...",admin_panel:"Quản trị",update_key:"Cập nhật API Key",no_sessions:"Chưa có cuộc trò chuyện nào",type_message:"Nhập tin nhắn...",pending_approval:"Chờ duyệt",plan_steps:"bước",risk_level:"Rủi ro",clarify_title:"Cần thêm thông tin",loading:"Đang tải...",lang_toggle:"EN"}};
let currentLang=localStorage.getItem('lang')||'en';
function setLang(l){currentLang=l;localStorage.setItem('lang',l);document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(I18N[l][k]){if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')el.placeholder=I18N[l][k];else el.textContent=I18N[l][k]}});document.getElementById('langBtn').textContent=I18N[l].lang_toggle}
function toggleLang(){setLang(currentLang==='en'?'vi':'en')}

// === State ===
let guildId='',userId='';
let activeSession=null;

// === Guild ===
async function loadGuilds(){
  try{const r=await fetch('/api/auth/guilds');const d=await r.json();const sel=document.getElementById('guildSelect');
  sel.innerHTML='<option value="" data-i18n="select_server">'+I18N[currentLang].select_server+'</option>';
  (d.guilds||d||[]).forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.name;sel.appendChild(o)})}catch(e){console.error(e)}
}
function selectGuild(id){guildId=id;if(id){loadServerInfo();loadSessions();loadStructure();loadAudit()}}
async function loadServerInfo(){
  try{const r=await fetch(`/api/guild/${guildId}/info`);const d=await r.json();
  document.getElementById('infoChannels').textContent=d.channel_count||d.channels||'--';
  document.getElementById('infoRoles').textContent=d.role_count||d.roles||'--';
  document.getElementById('infoMembers').textContent=d.member_count||d.members||'--'}catch(e){}
}

// === Sessions ===
async function loadSessions(){
  if(!guildId)return;
  try{const r=await fetch(`/api/sessions?guild_id=${guildId}&user_id=${userId}`);const d=await r.json();
  const list=document.getElementById('sessionList');
  const sessions=d.sessions||[];
  if(!sessions.length){list.innerHTML='<div class="empty-state" data-i18n="no_sessions">'+I18N[currentLang].no_sessions+'</div>';return}
  const now=new Date(),groups={today:[],yesterday:[],week:[],earlier:[]};
  sessions.forEach(s=>{const dt=new Date(s.last_active_at||s.created_at);const diff=Math.floor((now-dt)/864e5);
    if(diff<1)groups.today.push(s);else if(diff<2)groups.yesterday.push(s);else if(diff<7)groups.week.push(s);else groups.earlier.push(s)});
  let html='';
  const render=(label,items)=>{if(!items.length)return;html+=`<div class="session-group" data-i18n="${label}">${I18N[currentLang][label]}</div>`;
    items.forEach(s=>{const cls=s.id===activeSession?'session-item active':'session-item';html+=`<div class="${cls}" data-session="${s.id}" onclick="loadSession('${s.id}')">${s.first_message||'...'}</div>`})};
  render('today',groups.today);render('yesterday',groups.yesterday);render('this_week',groups.week);render('earlier',groups.earlier);
  list.innerHTML=html}catch(e){console.error(e)}
}
async function loadSession(id){
  activeSession=id;const el=document.getElementById('chatMessages');el.classList.add('loading');
  document.querySelectorAll('.session-item').forEach(e=>e.classList.remove('active'));
  document.querySelector(`[data-session="${id}"]`)?.classList.add('active');
  try{const r=await fetch(`/api/sessions/${id}/history`);const d=await r.json();
  await new Promise(r=>setTimeout(r,80));renderMessages(d.history||[])}catch(e){el.innerHTML='<div class="empty-state">Error loading session</div>'}
  el.classList.remove('loading');
}
async function newChat(){
  if(!guildId)return;
  try{const r=await fetch(`/api/sessions/new?guild_id=${guildId}&user_id=${userId}`,{method:'POST'});const d=await r.json();
  activeSession=d.id;document.getElementById('chatMessages').innerHTML='';loadSessions()}catch(e){console.error(e)}
}

// === Render Messages ===
function renderMessages(history){
  const el=document.getElementById('chatMessages');
  if(!history||!history.length){el.innerHTML='<div class="empty-state" data-i18n="no_sessions">'+I18N[currentLang].no_sessions+'</div>';return}
  let html='';history.forEach(m=>{
    if(m.role==='user')html+=`<div class="msg msg-user"><div class="msg-bubble">${esc(m.content)}</div></div>`;
    else html+=`<div class="msg msg-bot"><div class="msg-bubble">${marked.parse(m.content||'')}</div></div>`});
  el.innerHTML=html;el.scrollTop=el.scrollHeight;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// === Send Message (Streaming) ===
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function sendMessage(){
  const input=document.getElementById('chatInput');const text=input.value.trim();if(!text||!guildId)return;
  input.value='';appendMsg('user',text);
  const botDiv=appendMsg('bot','');botDiv._rawText='';
  try{
    const resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,guild_id:guildId,user_id:userId})});
    if(!resp.ok){const fallback=await fetchFallback(text);botDiv.querySelector('.msg-bubble').innerHTML=marked.parse(fallback);return}
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){if(!line.startsWith('data: '))continue;const raw=line.slice(6);if(raw==='[DONE]')break;
        try{const chunk=JSON.parse(raw);handleChunk(chunk,botDiv)}catch(e){}}}
  }catch(e){botDiv.querySelector('.msg-bubble').innerHTML='<span style="color:var(--danger)">Connection error</span>'}
  document.getElementById('chatMessages').scrollTop=999999;
}
async function fetchFallback(text){
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,guild_id:guildId,user_id:userId})});
  const d=await r.json();return d.response||d.message||JSON.stringify(d)}catch(e){return 'Error: '+e.message}
}
function handleChunk(chunk,botDiv){
  const bubble=botDiv.querySelector('.msg-bubble');
  if(chunk.type==='text'){botDiv._rawText+=chunk.content;bubble.innerHTML=marked.parse(botDiv._rawText)}
  else if(chunk.type==='status'){bubble.innerHTML=`<div class="status-indicator">${esc(chunk.message||chunk.status)}</div>`+(botDiv._rawText?marked.parse(botDiv._rawText):'')}
  else if(chunk.type==='approval'){bubble.innerHTML=renderApprovalCard(chunk)}
  else if(chunk.type==='clarify'){bubble.innerHTML=renderClarifyCard(chunk)}
  else if(chunk.type==='done'){if(chunk.final_message){botDiv._rawText+='\n\n'+chunk.final_message;bubble.innerHTML=marked.parse(botDiv._rawText)}}
  else if(chunk.type==='error'){bubble.innerHTML=`<span style="color:var(--danger)">${esc(chunk.message)}</span>`}
  document.getElementById('chatMessages').scrollTop=999999;
}
function renderApprovalCard(d){
  const steps=(d.steps||[]).map((s,i)=>`<div class="plan-step">${i+1}. ${esc(s.tool_name||'')} - ${esc(s.description||'')}</div>`).join('');
  const risk=d.risk||'MEDIUM';const rc=risk.toLowerCase();
  return `<div class="approval-card"><div class="card-title" data-i18n="pending_approval">${I18N[currentLang].pending_approval}</div>
  <div style="font-size:13px;margin:4px 0">${esc(d.summary||'')}</div>${steps}
  <div class="risk-badge risk-${rc}">${risk}</div>
  <div class="card-actions"><button class="btn-approve" data-i18n="approve" onclick="doApproval('${d.plan_id}','approve')">${I18N[currentLang].approve}</button>
  <button class="btn-reject" data-i18n="reject" onclick="doApproval('${d.plan_id}','reject')">${I18N[currentLang].reject}</button></div></div>`;
}
function renderClarifyCard(d){
  const qs=(d.questions||[]).map(q=>`<li>${esc(q)}</li>`).join('');
  return `<div class="clarify-card"><div class="card-title" data-i18n="clarify_title">${I18N[currentLang].clarify_title}</div>
  <div style="font-size:12px;color:var(--text-secondary);margin:2px 0">${esc(d.summary||'')}</div>
  <ol class="clarify-list">${qs}</ol></div>`;
}
function appendMsg(role,content){
  const el=document.getElementById('chatMessages');
  if(el.querySelector('.empty-state'))el.innerHTML='';
  const div=document.createElement('div');div.className=`msg msg-${role}`;
  div.innerHTML=`<div class="msg-bubble">${role==='user'?esc(content):marked.parse(content)}</div>`;
  el.appendChild(div);el.scrollTop=el.scrollHeight;return div;
}
async function doApproval(planId,action){
  try{await fetch('/api/approval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan_id:planId,action,user_id:userId})});
  document.querySelectorAll('.approval-card .card-actions').forEach(el=>el.innerHTML=`<span style="font-size:12px;color:var(--text-muted)">${action==='approve'?'Approved':'Rejected'}</span>`)}catch(e){}
}

// === Right Panel ===
function switchTab(tab){
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.panel-tab[data-i18n="${tab==='structure'?'structure':'audit_log'}"]`).classList.add('active');
  document.getElementById('tabStructure').hidden=tab!=='structure';
  document.getElementById('tabAudit').hidden=tab!=='audit';
}
async function loadStructure(){
  if(!guildId)return;const el=document.getElementById('tabStructure');
  try{const r=await fetch(`/api/guild/${guildId}/info`);const d=await r.json();
  let html='';const cats=d.categories||[];const roles=d.roles||[];
  if(cats.length){cats.forEach(c=>{html+=`<div class="tree-cat"><span class="tree-icon">&#9656;</span> ${esc(c.name)}</div>`;
    (c.channels||[]).forEach(ch=>{const icon=ch.type==='voice'?'&#9835;':'#';html+=`<div class="tree-item"><span class="tree-icon">${icon}</span> ${esc(ch.name)}</div>`})})}
  if(roles.length){html+=`<div class="tree-cat" style="margin-top:10px"><span class="tree-icon">&#9656;</span> Roles</div>`;
    roles.forEach(r=>{html+=`<div class="tree-item"><span class="tree-icon" style="color:${r.color||'inherit'}">&#9679;</span> ${esc(r.name)}</div>`})}
  el.innerHTML=html||'<div class="empty-state">No data</div>'}catch(e){el.innerHTML='<div class="empty-state">Error</div>'}
}
async function loadAudit(){
  if(!guildId)return;const el=document.getElementById('tabAudit');
  try{const r=await fetch(`/api/audit?guild_id=${guildId}&limit=20`);const d=await r.json();
  const entries=d.entries||[];if(!entries.length){el.innerHTML='<div class="empty-state">No entries</div>';return}
  let html='';entries.forEach(e=>{const dot=e.success?'ok':'fail';const time=e.executed_at?timeAgo(e.executed_at):'';
    html+=`<div class="audit-entry"><span class="audit-dot ${dot}"></span><span class="audit-tool">${esc(e.tool_name)}</span><span class="audit-time">${time}</span></div>`});
  el.innerHTML=html}catch(e){el.innerHTML='<div class="empty-state">Error</div>'}
}
function timeAgo(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}

// === Admin ===
async function updateKey(){
  const key=document.getElementById('adminKeyInput').value.trim();if(!key)return;
  try{await fetch('/api/admin/update-gemini-key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({api_key:key})});
  document.getElementById('adminKeyInput').value='';alert('Updated')}catch(e){alert('Error')}
}
document.getElementById('adminSection').style.display='none';

// === Init ===
function logout(){window.location.href='/api/auth/login'}
window.addEventListener('DOMContentLoaded',()=>{
  // Auth check — load user from localStorage
  const stored=localStorage.getItem('user');
  if(!stored||!localStorage.getItem('token')){window.location.href='/login';return;}
  try{
    const u=JSON.parse(stored);
    userId=u.id||'';
    document.getElementById('navUser').textContent=u.username||'';
    if(u.avatar_url)document.getElementById('navAvatar').src=u.avatar_url;
    if(u.is_admin)document.getElementById('adminSection').style.display='block';
  }catch(e){window.location.href='/login';return;}
  setLang(currentLang);
  loadGuilds();
});
</script>
