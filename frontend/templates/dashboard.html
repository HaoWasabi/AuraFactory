<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraFactory - Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* Layout */
.layout{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color)}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-logo{width:32px;height:32px;border-radius:50%;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.nav-title{font-size:15px;font-weight:600;color:var(--text-primary)}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-user{font-size:13px;color:var(--text-secondary)}
.nav-avatar{width:28px;height:28px;border-radius:50%}
.btn-s{background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:6px;color:var(--text-secondary);padding:4px 10px;font-size:12px;cursor:pointer}
.btn-s:hover{background:var(--accent-primary);color:#fff}

/* Guild picker */
.guild-picker{position:relative}
.guild-btn{background:var(--bg-input);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);padding:6px 10px;font-size:13px;min-width:180px;cursor:pointer;text-align:left}
.guild-btn:hover{border-color:var(--accent-primary)}
.guild-menu{position:absolute;top:100%;left:0;min-width:260px;background:var(--bg-panel);border:1px solid var(--border-color);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:100;max-height:340px;overflow-y:auto;margin-top:4px}
.guild-menu.hidden{display:none}
.guild-section-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;padding:8px 12px 4px;letter-spacing:.5px;font-weight:600}
.guild-item{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.guild-item:hover{background:var(--bg-hover)}
.guild-item.active{background:var(--accent-primary);color:#fff}
.guild-item .badge{font-size:10px;padding:2px 6px;border-radius:10px;margin-left:auto;font-weight:500}
.badge-ready{background:var(--success);color:#fff}
.badge-invite{background:var(--warning);color:#000}
.guild-divider{height:1px;background:var(--border-subtle);margin:4px 0}

/* Content */
.content{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.side{width:260px;background:var(--bg-panel);border-right:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden}
.side-hdr{padding:12px;border-bottom:1px solid var(--border-subtle)}
.btn-new{width:100%;padding:8px;background:var(--accent-primary);border:none;border-radius:6px;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
.btn-new:hover{background:var(--accent-hover)}
.sess-list{flex:1;overflow-y:auto;padding:8px}
.sess-grp{font-size:11px;color:var(--text-muted);text-transform:uppercase;padding:8px 4px 4px;letter-spacing:.5px}
.sess-item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:2px;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item:hover{background:var(--bg-hover)}
.sess-item.active{background:var(--accent-primary);color:#fff}
.side-info{padding:12px;border-top:1px solid var(--border-subtle);font-size:12px;color:var(--text-muted)}
.side-info .row{display:flex;justify-content:space-between;padding:3px 0}
.side-info .val{color:var(--text-secondary)}

/* Admin section */
.admin-sec{padding:12px;border-top:1px solid var(--border-subtle);display:none}
.admin-sec .sec-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.admin-sec input{width:100%;background:var(--bg-input);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);padding:6px 8px;font-size:12px;margin-bottom:6px;box-sizing:border-box}
.admin-sec button{width:100%;padding:6px;background:var(--accent-primary);border:none;border-radius:6px;color:#fff;font-size:12px;cursor:pointer}

/* Main chat */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg-user{align-self:flex-end;background:var(--chat-user);color:#fff;border-bottom-right-radius:4px}
.msg-bot{align-self:flex-start;background:var(--chat-bot);color:var(--text-primary);border-bottom-left-radius:4px}
.msg-bot p{margin:4px 0}
.msg-bot code{background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px;font-size:12px}
.msg-bot pre{background:rgba(0,0,0,.3);padding:8px;border-radius:6px;overflow-x:auto;font-size:12px}

/* Approval card */
.card-approval{background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:10px;padding:14px;margin:6px 0;align-self:flex-start;max-width:80%}
.card-approval .summary{font-weight:500;margin-bottom:6px;font-size:14px}
.card-approval .steps{font-size:12px;color:var(--text-secondary);margin-bottom:10px}
.card-approval .step{padding:2px 0}
.card-approval .actions{display:flex;gap:8px}
.card-approval .risk{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.risk-low{background:var(--risk-low);color:#000}
.risk-medium{background:var(--risk-medium);color:#000}
.risk-high{background:var(--risk-high);color:#fff}
.risk-critical{background:var(--risk-critical);color:#fff}
.btn-approve{background:var(--success);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer}
.btn-reject{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer}

/* Clarify card */
.card-clarify{background:var(--bg-tertiary);border:1px solid var(--warning);border-radius:10px;padding:14px;margin:6px 0;align-self:flex-start;max-width:80%}
.card-clarify .ctitle{font-weight:500;margin-bottom:6px;color:var(--warning);font-size:14px}
.card-clarify ul{padding-left:18px;font-size:13px;color:var(--text-secondary)}
.card-clarify li{padding:3px 0}

/* Input bar */
.input-bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border-color);background:var(--bg-secondary)}
.input-bar input{flex:1;background:var(--bg-input);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);padding:10px 14px;font-size:14px;outline:none}
.input-bar input:focus{border-color:var(--accent-primary)}
.input-bar.locked input,.input-bar.locked button{opacity:.5;pointer-events:none}
.input-bar button{background:var(--accent-primary);border:none;border-radius:8px;color:#fff;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:500}
.input-bar button:hover{background:var(--accent-hover)}

/* Streaming cursor */
.streaming::after{content:"\2588";animation:blink .8s infinite;color:var(--accent-primary)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Right panel */
.rpanel{width:280px;background:var(--bg-panel);border-left:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden}
.rpanel.hidden{display:none}
.rp-tabs{display:flex;border-bottom:1px solid var(--border-subtle)}
.rp-tab{flex:1;padding:10px;font-size:12px;text-align:center;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent}
.rp-tab.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary)}
.rp-content{flex:1;overflow-y:auto;padding:12px;font-size:13px}
.tree-cat{padding:4px 0;color:var(--text-accent);font-weight:500}
.tree-ch{padding:2px 0 2px 16px;color:var(--text-secondary)}
.audit-entry{padding:6px 0;border-bottom:1px solid var(--border-subtle);font-size:12px}
.audit-ok{color:var(--success)}
.audit-fail{color:var(--danger)}

/* Responsive */
@media(max-width:768px){.side{display:none}.rpanel{display:none}}
</style>
</head>
<body>
<div class="layout">
  <!-- Navbar -->
  <nav class="nav">
    <div class="nav-left">
      <div class="nav-logo">A</div>
      <span class="nav-title">AuraFactory</span>
      <div class="guild-picker" id="guildPicker">
        <button class="guild-btn" id="guildBtn" onclick="toggleGuildMenu()">Select server...</button>
        <div class="guild-menu hidden" id="guildMenu">
          <div id="guildReady"></div>
          <div class="guild-divider" id="guildDivider" style="display:none"></div>
          <div id="guildPending"></div>
        </div>
      </div>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <img class="nav-avatar" id="navAvatar" src="" alt="" onerror="this.style.display='none'">
      <button class="btn-s" id="langBtn" onclick="toggleLang()">VI</button>
      <button class="btn-s" id="logoutBtn" onclick="logout()">Log out</button>
    </div>
  </nav>

  <div class="content">
    <!-- Sidebar -->
    <aside class="side">
      <div class="side-hdr">
        <button class="btn-new" id="btnNew" onclick="newChat()">New Chat</button>
      </div>
      <div class="sess-list" id="sessList"></div>
      <div class="side-info" id="sideInfo">
        <div class="row"><span id="lblCh">Channels</span><span class="val" id="valCh">-</span></div>
        <div class="row"><span id="lblRo">Roles</span><span class="val" id="valRo">-</span></div>
        <div class="row"><span id="lblMe">Members</span><span class="val" id="valMe">-</span></div>
      </div>
      <div class="admin-sec" id="adminSec">
        <div class="sec-title">Admin Panel</div>
        <input type="password" id="keyInput" placeholder="Gemini API Key">
        <button onclick="updateKey()">Update Key</button>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="main">
      <div class="msgs" id="msgs"></div>
      <div class="input-bar locked" id="inputBar">
        <input type="text" id="chatInput" placeholder="Select a server to start chatting..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()" id="sendBtn">Send</button>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="rpanel" id="rpanel">
      <div class="rp-tabs">
        <div class="rp-tab active" onclick="showTab('structure')" id="tabStruct">Structure</div>
        <div class="rp-tab" onclick="showTab('audit')" id="tabAudit">Audit Log</div>
      </div>
      <div class="rp-content" id="rpContent"></div>
    </aside>
  </div>
</div>

<script>
// === State ===
var guildId='',userId='',currentSession='',activeTab='structure';
var lang=localStorage.getItem('lang')||'en';

// === i18n ===
var T={
  en:{new_chat:'New Chat',select_server:'Select server...',channels:'Channels',roles:'Roles',members:'Members',
      structure:'Structure',audit_log:'Audit Log',send:'Send',approve:'Approve',reject:'Reject',logout:'Log out',
      type_msg:'Type a message...',no_sessions:'No conversations yet',clarify:'Need more information',toggle:'VI'},
  vi:{new_chat:'Chat moi',select_server:'Chon server...',channels:'Kenh',roles:'Vai tro',members:'Thanh vien',
      structure:'Cau truc',audit_log:'Nhat ky',send:'Gui',approve:'Duyet',reject:'Tu choi',logout:'Dang xuat',
      type_msg:'Nhap tin nhan...',no_sessions:'Chua co cuoc tro chuyen',clarify:'Can them thong tin',toggle:'EN'}
};
function setLang(l){
  lang=l;localStorage.setItem('lang',l);
  var t=T[l];
  document.getElementById('btnNew').textContent=t.new_chat;
  if(!guildId)document.getElementById('guildBtn').textContent=t.select_server;
  document.getElementById('lblCh').textContent=t.channels;
  document.getElementById('lblRo').textContent=t.roles;
  document.getElementById('lblMe').textContent=t.members;
  document.getElementById('tabStruct').textContent=t.structure;
  document.getElementById('tabAudit').textContent=t.audit_log;
  document.getElementById('sendBtn').textContent=t.send;
  document.getElementById('logoutBtn').textContent=t.logout;
  document.getElementById('chatInput').placeholder=t.type_msg;
  document.getElementById('langBtn').textContent=t.toggle;
}
function toggleLang(){setLang(lang==='en'?'vi':'en');}

// === Auth ===
function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/login';}
function initAuth(){
  var raw=localStorage.getItem('user');
  var token=localStorage.getItem('token');
  if(!raw||!token){window.location.href='/login';return false;}
  try{
    var u=JSON.parse(raw);
    userId=u.id||'';
    document.getElementById('navUser').textContent=u.username||'';
    if(u.avatar){
      document.getElementById('navAvatar').src='https://cdn.discordapp.com/avatars/'+u.id+'/'+u.avatar+'.png?size=64';
    }
    document.getElementById('adminSec').style.display='block';
    return true;
  }catch(e){window.location.href='/login';return false;}
}

// === API helper ===
function api(method,url,body){
  var opts={method:method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){
    if(r.status===401){logout();return null;}
    return r.json();
  });
}

// === Guilds ===
var _guildsData=null;
function loadGuilds(){
  if(!userId)return;
  api('GET','/api/auth/guilds?user_id='+userId).then(function(d){
    if(!d)return;
    _guildsData=d;
    renderGuildMenu(d);
  });
}
function renderGuildMenu(d){
  var readyEl=document.getElementById('guildReady');
  var pendingEl=document.getElementById('guildPending');
  var dividerEl=document.getElementById('guildDivider');
  var readyList=d.ready||[];
  var pendingList=d.pending||[];

  // Ready section
  var rHtml='';
  if(readyList.length){
    rHtml='<div class="guild-section-title">\u2713 Ready</div>';
    readyList.forEach(function(g){
      var cls='guild-item'+(g.guild_id===guildId?' active':'');
      rHtml+='<div class="'+cls+'" data-gid="'+g.guild_id+'" onclick="selectGuild(\''+g.guild_id+'\')">'
        +escHtml(g.guild_name)+'<span class="badge badge-ready">\u25cf</span></div>';
    });
  }
  readyEl.innerHTML=rHtml;

  // Pending section
  var pHtml='';
  if(pendingList.length){
    pHtml='<div class="guild-section-title">+ Invite Bot</div>';
    pendingList.forEach(function(g){
      pHtml+='<div class="guild-item" onclick="inviteBot(\''+g.invite_url+'\',\''+escHtml(g.guild_name)+'\')">'
        +escHtml(g.guild_name)+'<span class="badge badge-invite">invite</span></div>';
    });
  }
  pendingEl.innerHTML=pHtml;
  dividerEl.style.display=(readyList.length&&pendingList.length)?'block':'none';

  // Update button text if guild selected
  if(guildId){
    var cur=readyList.find(function(g){return g.guild_id===guildId;});
    if(cur)document.getElementById('guildBtn').textContent=cur.guild_name;
  }
}
function toggleGuildMenu(){
  var menu=document.getElementById('guildMenu');
  var isHidden=menu.classList.contains('hidden');
  if(isHidden){loadGuilds();}  // Always refresh list when opening
  menu.classList.toggle('hidden');
}
function inviteBot(url,name){
  if(confirm('Invite AuraFactory bot to "'+name+'"?')){
    window.open(url,'_blank');
    setTimeout(function(){loadGuilds();},5000);
  }
  document.getElementById('guildMenu').classList.add('hidden');
}
function selectGuild(id){
  guildId=id;
  document.getElementById('guildMenu').classList.add('hidden');
  if(!id)return;
  // Unlock chat input
  document.getElementById('inputBar').classList.remove('locked');
  document.getElementById('chatInput').placeholder=T[lang].type_msg;
  // Update button text
  if(_guildsData){
    var cur=(_guildsData.ready||[]).find(function(g){return g.guild_id===id;});
    if(cur)document.getElementById('guildBtn').textContent=cur.guild_name;
  }
  loadSessions();
  loadGuildData();
}

// === Server info + Structure (single API call) ===
var _guildData=null;
function loadGuildData(){
  if(!guildId)return;
  api('GET','/api/guild/'+guildId+'/info').then(function(d){
    if(!d)return;
    _guildData=d;
    document.getElementById('valCh').textContent=d.channel_count||d.channels||'-';
    document.getElementById('valRo').textContent=d.role_count||d.roles||'-';
    document.getElementById('valMe').textContent=d.member_count||d.members||'-';
    if(activeTab==='structure')renderStructure(d);
    else loadAudit();
  });
}

// === Sessions ===
function loadSessions(){
  api('GET','/api/sessions?guild_id='+guildId+'&user_id='+userId).then(function(d){
    if(!d||!d.sessions)return;
    var el=document.getElementById('sessList');
    if(d.sessions.length===0){el.innerHTML='<p style="padding:12px;color:var(--text-muted);font-size:12px">'+T[lang].no_sessions+'</p>';return;}
    var html='';
    d.sessions.forEach(function(s){
      var cls=s.id===currentSession?'sess-item active':'sess-item';
      html+='<div class="'+cls+'" data-sid="'+s.id+'" onclick="loadSession(\''+s.id+'\')">'+escHtml(s.first_message||'...')+'</div>';
    });
    el.innerHTML=html;
  });
}
function loadSession(sid){
  currentSession=sid;
  api('GET','/api/sessions/'+sid+'/history').then(function(d){
    if(!d)return;
    var el=document.getElementById('msgs');el.innerHTML='';
    var history=d.history||[];
    if(typeof history==='string'){try{history=JSON.parse(history);}catch(e){history=[];}}
    history.forEach(function(m){
      if(m.role==='user')appendUserMsg(m.content);
      else appendBotMsg(m.content);
    });
    el.scrollTop=el.scrollHeight;
    // Update active highlight without re-fetching from server
    var items=document.querySelectorAll('.sess-item');
    items.forEach(function(item){
      item.classList.remove('active');
      if(item.getAttribute('data-sid')===sid)item.classList.add('active');
    });
  });
}
function newChat(){
  if(!guildId)return;
  api('POST','/api/sessions/new?guild_id='+guildId+'&user_id='+userId).then(function(d){
    if(!d)return;
    currentSession=d.id;
    document.getElementById('msgs').innerHTML='';
    loadSessions();
  });
}

// === Chat ===
function sendMsg(){
  var input=document.getElementById('chatInput');
  var text=input.value.trim();
  if(!text||!guildId)return;
  input.value='';
  appendUserMsg(text);
  sendStream(text);
}
function appendUserMsg(text){
  var el=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='msg msg-user';
  div.textContent=text;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}
function appendBotMsg(text){
  var el=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='msg msg-bot';
  div.innerHTML=marked.parse(text||'');
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
  return div;
}

// === Streaming ===
function sendStream(text){
  var el=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='msg msg-bot streaming';
  div.innerHTML='';
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
  var raw='';

  fetch('/api/chat/stream',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:text,guild_id:guildId,user_id:userId,session_id:currentSession||''})
  }).then(function(resp){
    if(!resp.ok){
      div.classList.remove('streaming');
      resp.json().then(function(d){div.innerHTML='<span style="color:var(--danger)">'+escHtml(d.error||d.detail||'Server error')+'</span>';}).catch(function(){div.innerHTML='<span style="color:var(--danger)">Server error ('+resp.status+')</span>';});
      return;
    }
    var reader=resp.body.getReader();
    var decoder=new TextDecoder();
    var buffer='';
    function read(){
      reader.read().then(function(result){
        if(result.done){div.classList.remove('streaming');return;}
        buffer+=decoder.decode(result.value,{stream:true});
        var lines=buffer.split('\n');
        buffer=lines.pop();
        lines.forEach(function(line){
          if(line.indexOf('data: ')!==0)return;
          var payload=line.slice(6);
          if(payload==='[DONE]'){div.classList.remove('streaming');return;}
          try{
            var chunk=JSON.parse(payload);
            if(chunk.type==='text'){raw+=chunk.content;div.innerHTML=marked.parse(raw);}
            else if(chunk.type==='status'){div.innerHTML='<em>'+escHtml(chunk.message||chunk.status)+'</em>';}
            else if(chunk.type==='approval'){renderApproval(chunk);}
            else if(chunk.type==='clarify'){renderClarify(chunk);}
            else if(chunk.type==='done'){div.classList.remove('streaming');if(chunk.final_message){raw+=chunk.final_message;div.innerHTML=marked.parse(raw);}}
            else if(chunk.type==='error'){div.classList.remove('streaming');div.innerHTML='<span style="color:var(--danger)">'+escHtml(chunk.message)+'</span>';}
          }catch(e){}
          el.scrollTop=el.scrollHeight;
        });
        read();
      });
    }
    read();
  }).catch(function(){
    // Fallback to non-streaming
    div.classList.remove('streaming');
    api('POST','/api/chat',{message:text,guild_id:guildId,user_id:userId}).then(function(d){
      if(d&&(d.content||d.error))div.innerHTML=marked.parse(d.content||d.error);
      else div.innerHTML='<span style="color:var(--danger)">Error</span>';
    });
  });
}

// === Approval card ===
function renderApproval(data){
  var el=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='card-approval';
  var riskCls='risk-'+((data.risk||'medium').toLowerCase());
  var stepsHtml='';
  (data.steps||[]).forEach(function(s,i){stepsHtml+='<div class="step">'+(i+1)+'. '+(s.description||s.tool_name)+'</div>';});
  div.innerHTML='<span class="risk '+riskCls+'">'+(data.risk||'MEDIUM')+'</span>'+
    '<div class="summary">'+escHtml(data.summary||'')+'</div>'+
    '<div class="steps">'+stepsHtml+'</div>'+
    '<div class="actions"><button class="btn-approve" onclick="doApprove(\''+data.plan_id+'\')">'+T[lang].approve+'</button>'+
    '<button class="btn-reject" onclick="doReject(\''+data.plan_id+'\')">'+T[lang].reject+'</button></div>';
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}
function doApprove(pid){api('POST','/api/approval',{plan_id:pid,action:'approve',user_id:userId}).then(function(){appendBotMsg('Plan approved. Executing...');});}
function doReject(pid){api('POST','/api/approval',{plan_id:pid,action:'reject',user_id:userId}).then(function(){appendBotMsg('Plan rejected.');});}

// === Clarify card ===
function renderClarify(data){
  var el=document.getElementById('msgs');
  var div=document.createElement('div');
  div.className='card-clarify';
  var qs='';(data.questions||[]).forEach(function(q){qs+='<li>'+escHtml(q)+'</li>';});
  div.innerHTML='<div class="ctitle">'+T[lang].clarify+'</div><ul>'+qs+'</ul>';
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}

// === Right panel ===
function showTab(tab){
  activeTab=tab;
  document.getElementById('tabStruct').className='rp-tab'+(tab==='structure'?' active':'');
  document.getElementById('tabAudit').className='rp-tab'+(tab==='audit'?' active':'');
  if(tab==='structure')loadStructure();
  else loadAudit();
}
function loadStructure(){
  if(_guildData)renderStructure(_guildData);
  else if(guildId)loadGuildData();
  else document.getElementById('rpContent').innerHTML='';
}
function renderStructure(d){
  var html='';
  if(d.categories_detail&&d.categories_detail.length){d.categories_detail.forEach(function(cat){
    html+='<div class="tree-cat">\u25BC '+escHtml(cat.name)+'</div>';
    (cat.channels||[]).forEach(function(ch){
      var icon=ch.type==='voice'?'\ud83d\udd0a ':'# ';
      html+='<div class="tree-ch">'+icon+escHtml(ch.name)+'</div>';
    });
  });}
  if(d.roles_detail&&d.roles_detail.length){html+='<div class="tree-cat" style="margin-top:12px">\ud83d\udc51 Roles</div>';
    d.roles_detail.forEach(function(r){html+='<div class="tree-ch">@'+escHtml(r.name)+'</div>';});
  }
  document.getElementById('rpContent').innerHTML=html||'<p style="color:var(--text-muted)">Select a server</p>';
}
function loadAudit(){
  if(!guildId){document.getElementById('rpContent').innerHTML='';return;}
  api('GET','/api/audit?guild_id='+guildId+'&limit=20').then(function(d){
    if(!d||!d.entries)return;
    var html='';
    d.entries.forEach(function(e){
      var cls=e.success?'audit-ok':'audit-fail';
      var icon=e.success?'[OK]':'[FAIL]';
      html+='<div class="audit-entry"><span class="'+cls+'">'+icon+'</span> '+escHtml(e.tool_name)+'</div>';
    });
    document.getElementById('rpContent').innerHTML=html||'<p style="color:var(--text-muted)">No entries</p>';
  });
}

// === Admin ===
function updateKey(){
  var key=document.getElementById('keyInput').value.trim();
  if(!key)return;
  api('POST','/api/admin/update-gemini-key',{api_key:key,user_id:userId}).then(function(d){
    document.getElementById('keyInput').value='';
    alert(d&&d.message?d.message:'Updated!');
  });
}

// === Util ===
function escHtml(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// === Init ===
if(initAuth()){setLang(lang);loadGuilds();}

// === Close guild menu on outside click ===
document.addEventListener('click',function(e){
  if(!e.target.closest('.guild-picker'))document.getElementById('guildMenu').classList.add('hidden');
});
</script>
</body>
