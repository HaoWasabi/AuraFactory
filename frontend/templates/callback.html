<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AuraFactory — Đang xác thực...</title>
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #1a1a2e; color: #e2e8f0;
            font-family: -apple-system, sans-serif;
        }
        .container { text-align: center; }
        .spinner { font-size: 48px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner">🔄</div>
        <p>Đang xác thực với Discord...</p>
    </div>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');

            if (!code) {
                document.querySelector('p').textContent = '❌ Lỗi: Không nhận được mã xác thực.';
                return;
            }

            try {
                const resp = await fetch(`/api/auth/callback?code=${code}&state=${state}`);
                const data = await resp.json();

                if (data.user) {
                    // Save user to localStorage
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    localStorage.setItem('aura_guilds', JSON.stringify(data.guilds || []));
                    window.location.href = '/dashboard';
                } else {
                    document.querySelector('p').textContent = '❌ Xác thực thất bại.';
                }
            } catch (e) {
                document.querySelector('p').textContent = '❌ Lỗi kết nối: ' + e.message;
            }
        })();
    </script>
</body>
</html>
