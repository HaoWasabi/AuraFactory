<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AuraFactory — Đang xác thực...</title>
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #1a1a2e; color: #e2e8f0;
            font-family: -apple-system, sans-serif;
        }
        .container { text-align: center; }
        .spinner { font-size: 48px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .error { color: #fc8181; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner">🔄</div>
        <p id="status">Đang xác thực với Discord...</p>
    </div>
    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');
            const statusEl = document.getElementById('status');

            if (!code) {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Lỗi: Không nhận được mã xác thực.';
                return;
            }

            // Verify state matches what we stored
            const savedState = localStorage.getItem('aura_oauth_state');
            if (state && savedState && state !== savedState) {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Lỗi: State mismatch — có thể bị tấn công CSRF.';
                return;
            }

            try {
                const resp = await fetch(`/api/auth/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`);
                const data = await resp.json();

                if (resp.ok && data.user) {
                    // Save user to localStorage
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    // Clean up oauth state
                    localStorage.removeItem('aura_oauth_state');
                    
                    statusEl.textContent = '✅ Đăng nhập thành công! Đang chuyển hướng...';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    statusEl.className = 'error';
                    statusEl.textContent = `❌ Xác thực thất bại: ${data.detail || 'Unknown error'}`;
                }
            } catch (e) {
                statusEl.className = 'error';
                statusEl.textContent = '❌ Lỗi kết nối: ' + e.message;
            }
        })();
    </script>
</body>
</html>
