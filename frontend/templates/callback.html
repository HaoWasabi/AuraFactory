<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraFactory</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-primary)}
.wrap{text-align:center}
.wrap p{font-size:14px;color:var(--text-secondary);margin-top:16px}
.spin{width:28px;height:28px;border:3px solid var(--border-color);border-top-color:var(--accent-primary);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap"><div class="spin"></div><p>Redirecting...</p></div>
<script>
(function(){
  var search=new URLSearchParams(window.location.search);
  var code=search.get('code');
  var state=search.get('state')||'';
  if(!code){window.location.href='/login';return;}

  var u=new URL('/api/auth/callback',window.location.origin);
  u.searchParams.set('code',code);
  u.searchParams.set('state',state);

  fetch(u.toString())
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.token)localStorage.setItem('token',d.token);
      if(d.user)localStorage.setItem('user',JSON.stringify(d.user));
      window.location.href='/dashboard';
    })
    .catch(function(){window.location.href='/login';});
})();
</script>
</body>
</html>
