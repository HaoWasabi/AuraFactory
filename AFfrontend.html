<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aura Factory</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Thư viện htm để viết JSX không cần Babel -->
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  <!-- Marked để xử lý Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.0.18/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #1a1b23;
      --bg-secondary: #22232d;
      --bg-sidebar: #1e1f28;
      --bg-input: #2a2b36;
      --bg-hover: #2d2e3a;
      --text-primary: #e4e5e9;
      --text-secondary: #a0a1b2;
      --accent: #7c5cfc;
      --accent-light: #9b8aff;
      --border: #3a3b48;
      --danger: #ef4444;
      --success: #10b981;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-width: 280px;
      --header-height: 56px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
    .light-theme {
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-sidebar: #ffffff;
      --bg-input: #ffffff;
      --bg-hover: #f0f0f5;
      --text-primary: #1c1c28;
      --text-secondary: #5a5a72;
      --border: #e0e0e8;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    #root {
      width: 100%;
      height: 100vh;
      display: flex;
      position: relative;
    }
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 20;
    }
    @media (max-width: 768px) {
      .sidebar-overlay.active { display: block; }
    }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 30;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow);
      }
      .sidebar.open { transform: translateX(0); }
    }
    .sidebar-header { padding: 20px 20px 12px; }
    .new-chat-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
      width: 100%;
      justify-content: center;
    }
    .new-chat-btn:hover { background: var(--accent-light); }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .chat-item:hover { background: var(--bg-hover); }
    .chat-item.active {
      background: var(--bg-hover);
      color: var(--text-primary);
      font-weight: 500;
    }
    .chat-item .title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pin-icon { color: var(--accent); margin-right: 6px; font-size: 14px; }
    .chat-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chat-item:hover .chat-actions { opacity: 1; }
    .chat-actions button {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .chat-actions button:hover { background: var(--border); color: var(--text-primary); }
    .sidebar-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .sidebar-footer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.2s;
    }
    .sidebar-footer-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-primary);
      position: relative;
      height: 100%;
    }
    .header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .hamburger {
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      display: none;
    }
    @media (max-width: 768px) {
      .hamburger { display: block; }
    }
    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }
    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 42px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 0;
      box-shadow: var(--shadow);
      min-width: 180px;
      z-index: 50;
      display: none;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item {
      padding: 10px 16px;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 14px;
    }
    .dropdown-item:hover { background: var(--bg-hover); }
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }
    .user-message {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 18px 18px 4px 18px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .ai-message {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      padding: 18px;
      max-width: 100%;
      word-wrap: break-word;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .toolbar button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .toolbar button:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--accent); }
    .toolbar button.agreed { background: var(--success); border-color: var(--success); color: white; cursor: default; }
    .code-block-container {
      position: relative;
      background: #0d0d14;
      border-radius: 10px;
      margin: 12px 0;
      overflow: hidden;
    }
    .code-block-header {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      background: #16162b;
      color: #a0a0b0;
      font-size: 13px;
    }
    .copy-code-btn { background: none; border: none; color: #a0a0b0; cursor: pointer; }
    .copy-code-btn:hover { color: white; }
    pre { margin: 0; padding: 12px 16px; overflow-x: auto; }
    code { font-family: 'Fira Code', monospace; font-size: 13px; }
    .input-area {
      padding: 12px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }
    .input-container {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border-radius: 16px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }
    .input-container textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      resize: none;
      font-size: 15px;
      font-family: var(--font);
      padding: 8px 0;
      outline: none;
      max-height: 120px;
    }
    .upload-btn, .send-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: color 0.2s;
    }
    .upload-btn:hover, .send-btn:hover { color: var(--accent); }
    .file-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .file-chip {
      background: var(--bg-hover);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-chip button { background: none; border: none; color: var(--danger); cursor: pointer; }
    .draft-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      z-index: 100;
      min-width: 320px;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .draft-option {
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 8px;
      background: var(--bg-primary);
    }
    .draft-option:hover { background: var(--bg-hover); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const html = htm.bind(React.createElement);

    // Component CodeBlock
    const CodeBlock = ({ code, language }) => {
      const [copied, setCopied] = React.useState(false);
      const handleCopy = () => {
        navigator.clipboard.writeText(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };
      return html`
        <div className="code-block-container">
          <div className="code-block-header">
            <span>${language || 'code'}</span>
            <button className="copy-code-btn" onClick=${handleCopy}>
              ${copied ? '✓ Copied' : '📋 Copy'}
            </button>
          </div>
          <pre><code>${code}</code></pre>
        </div>
      `;
    };

    // Hàm render Markdown
    function renderMarkdown(text) {
      const parts = text.split(/(```(\w+)?\n([\s\S]*?)```)/g);
      const elements = [];
      let i = 0;
      while (i < parts.length) {
        const part = parts[i];
        if (part && part.startsWith('```')) {
          const lang = parts[i+1] || '';
          const code = parts[i+2] || '';
          elements.push(html`<${CodeBlock} key=${i} code=${code} language=${lang} />`);
          i += 4;
        } else {
          if (part) {
            const htmlContent = marked.parse ? marked.parse(part) : marked(part);
            elements.push(html`<div key=${i} dangerouslySetInnerHTML=${{ __html: htmlContent }} />`);
          }
          i++;
        }
      }
      return elements;
    }

    function App() {
      const [theme, setTheme] = React.useState('dark');
      const [sidebarOpen, setSidebarOpen] = React.useState(false);
      const [chats, setChats] = React.useState([
        { id: '1', title: 'Kế hoạch phát triển sản phẩm', pinned: true, messages: [
          { role: 'user', content: 'Lên kế hoạch phát triển sản phẩm AI' },
          { role: 'ai', content: 'Dưới đây là kế hoạch chi tiết:\n```js\nconsole.log("Hello");\n```\nBảng so sánh:\n| Tính năng | Ưu tiên |\n|-----------|--------|\n| Chat | Cao |' }
        ]},
        { id: '2', title: 'Giải thích thuật toán', pinned: false, messages: [
          { role: 'user', content: 'Giải thích thuật toán sắp xếp nhanh' }
        ]},
      ]);
      const [activeChatId, setActiveChatId] = React.useState('1');
      const [inputValue, setInputValue] = React.useState('');
      const [uploadedFiles, setUploadedFiles] = React.useState([]);
      const [showDropdown, setShowDropdown] = React.useState(false);
      const [draftModal, setDraftModal] = React.useState(null);
      const [agreedMessages, setAgreedMessages] = React.useState(new Set());

      const chatFeedRef = React.useRef(null);
      const fileInputRef = React.useRef(null);

      // Đảm bảo activeChat luôn tồn tại
      const activeChat = (() => {
        const found = chats.find(c => c.id === activeChatId);
        return found || chats[0] || { id: null, messages: [] };
      })();

      React.useEffect(() => {
        document.body.className = theme === 'light' ? 'light-theme' : '';
      }, [theme]);

      React.useEffect(() => {
        if (chatFeedRef.current) {
          chatFeedRef.current.scrollTop = chatFeedRef.current.scrollHeight;
        }
      }, [activeChat.messages]);

      const handleNewChat = () => {
        const newChat = {
          id: Date.now().toString(),
          title: 'Cuộc trò chuyện mới',
          pinned: false,
          messages: []
        };
        setChats(prev => [newChat, ...prev]);
        setActiveChatId(newChat.id);
        setSidebarOpen(false);
      };

      const handleSend = () => {
        if (!inputValue.trim() && uploadedFiles.length === 0) return;
        const userMsg = { role: 'user', content: inputValue, files: [...uploadedFiles] };
        const aiResponse = {
          role: 'ai',
          content: `Cảm ơn bạn! Tôi đã nhận được: "${inputValue}". Đây là phản hồi mẫu với markdown.\n\`\`\`python\nprint("Hello AI")\n\`\`\`\n*Đề xuất:* Hãy xem xét thêm.`
        };
        setChats(prev => prev.map(chat => {
          if (chat.id === activeChatId) {
            return {
              ...chat,
              messages: [...chat.messages, userMsg, aiResponse],
              title: inputValue.slice(0, 40) || 'Cuộc trò chuyện'
            };
          }
          return chat;
        }));
        setInputValue('');
        setUploadedFiles([]);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        setUploadedFiles(prev => [...prev, ...files.map(f => ({ name: f.name, type: f.type }))]);
        e.target.value = '';
      };

      const removeFile = (index) => {
        setUploadedFiles(prev => prev.filter((_, i) => i !== index));
      };

      const togglePin = (chatId) => {
        setChats(prev => prev.map(c => c.id === chatId ? { ...c, pinned: !c.pinned } : c));
      };

      const deleteChat = (chatId) => {
        setChats(prev => prev.filter(c => c.id !== chatId));
        if (activeChatId === chatId) {
          setActiveChatId(prev => {
            const remaining = chats.filter(c => c.id !== chatId);
            return remaining.length > 0 ? remaining[0].id : null;
          });
        }
      };

      const renameChat = (chatId) => {
        const newName = prompt('Nhập tên mới:');
        if (newName) {
          setChats(prev => prev.map(c => c.id === chatId ? { ...c, title: newName } : c));
        }
      };

      const handleAgree = (messageIndex) => {
        const key = activeChatId + '-' + messageIndex;
        setAgreedMessages(prev => {
          const newSet = new Set(prev);
          if (newSet.has(key)) newSet.delete(key);
          else newSet.add(key);
          return newSet;
        });
      };

      const copyMessage = (content) => {
        navigator.clipboard.writeText(content);
        alert('Đã sao chép toàn bộ phản hồi.');
      };

      const exportMarkdown = (content) => {
        const blob = new Blob([content], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'response.md';
        a.click();
      };

      const viewDrafts = (messageIndex, userPrompt) => {
        const drafts = [
          `**Phương án 1:** Dựa trên yêu cầu "${userPrompt}", tôi đề xuất triển khai theo hướng tối ưu hiệu năng.`,
          `**Phương án 2:** Một cách tiếp cận khác là sử dụng kiến trúc microservices, phù hợp với quy mô lớn.`,
          `**Phương án 3:** Tôi đề xuất giải pháp đơn giản, tập trung vào UX và tốc độ phát triển.`
        ];
        setDraftModal({ messageIndex, drafts });
      };

      const selectDraft = (draftText) => {
        if (!draftModal) return;
        const { messageIndex } = draftModal;
        setChats(prev => prev.map(chat => {
          if (chat.id === activeChatId) {
            const newMessages = [...chat.messages];
            if (newMessages[messageIndex]) {
              newMessages[messageIndex] = { ...newMessages[messageIndex], content: draftText };
            }
            return { ...chat, messages: newMessages };
          }
          return chat;
        }));
        setDraftModal(null);
      };

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // Render chính
      return html`
        <div style=${{ display: 'flex', height: '100%', width: '100%' }}>
          <div className=${`sidebar-overlay ${sidebarOpen ? 'active' : ''}`} onClick=${() => setSidebarOpen(false)}></div>
          <aside className=${`sidebar ${sidebarOpen ? 'open' : ''}`}>
            <div className="sidebar-header">
              <button className="new-chat-btn" onClick=${handleNewChat}>
                <span>✨</span> Cuộc trò chuyện mới
              </button>
            </div>
            <div className="history-list">
              ${[...chats]
                .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
                .map(chat => html`
                  <div key=${chat.id} 
                    className=${`chat-item ${chat.id === activeChatId ? 'active' : ''}`}
                    onClick=${() => { setActiveChatId(chat.id); setSidebarOpen(false); }}>
                    <span className="title">
                      ${chat.pinned && html`<span className="pin-icon">📌</span>`}
                      ${chat.title}
                    </span>
                    <div className="chat-actions">
                      <button onClick=${(e) => { e.stopPropagation(); togglePin(chat.id); }} title="Ghim/Bỏ ghim">📌</button>
                      <button onClick=${(e) => { e.stopPropagation(); renameChat(chat.id); }} title="Đổi tên">✏️</button>
                      <button onClick=${(e) => { e.stopPropagation(); deleteChat(chat.id); }} title="Xóa">🗑️</button>
                    </div>
                  </div>
                `)}
            </div>
            <div className="sidebar-footer">
              <div className="sidebar-footer-item" onClick=${toggleTheme}>
                <span>🌓</span> Giao diện ${theme === 'dark' ? 'Sáng' : 'Tối'}
              </div>
              <div className="sidebar-footer-item" onClick=${() => alert('Trung tâm trợ giúp (Coming soon)')}>
                <span>❓</span> Trợ giúp
              </div>
              <div className="sidebar-footer-item" onClick=${() => alert('Hoạt động : tính năng đang phát triển.')}>
                <span>📊</span> Hoạt động 
              </div>
            </div>
          </aside>

          <div className="main-content">
            <header className="header">
              <button className="hamburger" onClick=${() => setSidebarOpen(!sidebarOpen)}>☰</button>
              <div style=${{ fontWeight: 600, fontSize: '18px' }}>AURA FACTORY</div>
              <div className="user-avatar" onClick=${() => setShowDropdown(!showDropdown)}>
                DV
                <div className=${`dropdown-menu ${showDropdown ? 'show' : ''}`}>
                  <div className="dropdown-item" onClick=${() => alert('Quản lý tài khoản Discord')}>👤 Tài khoản</div>
                  <div className="dropdown-item" onClick=${() => alert('Đăng xuất')}>🚪 Đăng xuất</div>
                </div>
              </div>
            </header>

            <div className="chat-feed" ref=${chatFeedRef}>
              ${activeChat.messages.length > 0
                ? activeChat.messages.map((msg, idx) => html`
                  <div key=${idx} className="message-row">
                    ${msg.role === 'user' ? html`
                      <div className="user-message">
                        ${msg.content}
                        ${msg.files && msg.files.length > 0 && html`
                          <div style=${{ marginTop: 8, display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                            ${msg.files.map((f, i) => html`<span key=${i} style=${{ background: 'rgba(255,255,255,0.2)', padding: '2px 8px', borderRadius: 12, fontSize: 12 }}>📎 ${f.name}</span>`)}
                          </div>
                        `}
                      </div>
                    ` : html`
                      <div className="ai-message">
                        ${renderMarkdown(msg.content)}
                        <div className="toolbar">
                          <button 
                            className=${agreedMessages.has(activeChatId + '-' + idx) ? 'agreed' : ''}
                            onClick=${() => handleAgree(idx)}
                          >
                            ${agreedMessages.has(activeChatId + '-' + idx) ? '✅ Đã đồng ý' : '👍 Đồng ý'}
                          </button>
                          <button onClick=${() => copyMessage(msg.content)}>📋 Sao chép</button>
                          <button onClick=${() => exportMarkdown(msg.content)}>⬇️ Xuất MD</button>
                          <button onClick=${() => {
                            const prevMsg = activeChat.messages[idx - 1];
                            const userPrompt = prevMsg ? prevMsg.content : '';
                            viewDrafts(idx, userPrompt);
                          }}>📄 Xem bản nháp khác</button>
                        </div>
                      </div>
                    `}
                  </div>
                `)
                : html`<div style=${{ textAlign: 'center', marginTop: 40, color: 'var(--text-secondary)' }}>Chưa có tin nhắn. Hãy bắt đầu cuộc trò chuyện.</div>`
              }
            </div>

            <div className="input-area">
              ${uploadedFiles.length > 0 && html`
                <div className="file-chips">
                  ${uploadedFiles.map((file, idx) => html`
                    <div key=${idx} className="file-chip">
                      <span>${file.name}</span>
                      <button onClick=${() => removeFile(idx)}>✕</button>
                    </div>
                  `)}
                </div>
              `}
              <div className="input-container">
                <input type="file" multiple ref=${fileInputRef} style=${{ display: 'none' }} onChange=${handleFileUpload} />
                <button className="upload-btn" onClick=${() => fileInputRef.current.click()} title="Tải tệp lên">📎</button>
                <textarea 
                  rows="1"
                  placeholder="Nhập câu lệnh..."
                  value=${inputValue}
                  onChange=${(e) => setInputValue(e.target.value)}
                  onKeyDown=${handleKeyDown}
                />
                <button className="send-btn" onClick=${handleSend} disabled=${!inputValue.trim() && uploadedFiles.length === 0}>➤</button>
              </div>
            </div>
          </div>

          ${draftModal && html`
            <>
              <div className="modal-backdrop" onClick=${() => setDraftModal(null)}></div>
              <div className="draft-modal">
                <h3 style=${{ marginBottom: 16, color: 'var(--text-primary)' }}>Chọn bản nháp khác</h3>
                ${draftModal.drafts.map((draft, i) => html`
                  <div key=${i} className="draft-option" onClick=${() => selectDraft(draft)}>
                    <div dangerouslySetInnerHTML=${{ __html: marked.parse ? marked.parse(draft) : marked(draft) }} />
                  </div>
                `)}
                <button onClick=${() => setDraftModal(null)} style=${{ marginTop: 12, background: 'var(--bg-hover)', border: 'none', padding: '8px 16px', borderRadius: 8, cursor: 'pointer', color: 'var(--text-primary)' }}>Đóng</button>
              </div>
            </>
          `}
        </div>
      `;
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(html`<${App} />`);
  </script>
</body>
</html>
