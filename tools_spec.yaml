# ============================================================================
# GRAPH GLOBAL EDGES (cross-module relationships)
# ============================================================================
graph_global_edges:
  # Feature dependencies
  - { from: "discord.channels.create[stage]", to: "COMMUNITY", relation: "requires_feature" }
  - { from: "discord.channels.create[forum]", to: "COMMUNITY", relation: "requires_feature" }
  - { from: "discord.channels.create[news]", to: "COMMUNITY", relation: "requires_feature" }
  - { from: "discord.community.toggle[enable=true]", to: "COMMUNITY", relation: "provides_feature" }
  
  # Common workflows (multi-step)
  - { from: "discord.channels.create[is_private=true]", to: "discord.roles.list", relation: "needs_data_from" }
  - { from: "discord.roles.assign", to: "discord.roles.list", relation: "needs_data_from" }
  - { from: "discord.roles.assign", to: "discord.members.list", relation: "needs_data_from" }
  - { from: "discord.events.create[entity_type=voice]", to: "discord.channels.list", relation: "needs_data_from" }
  - { from: "discord.webhooks.create", to: "discord.channels.list", relation: "needs_data_from" }
  - { from: "discord.features.setup_verification", to: "discord.roles.list", relation: "needs_data_from" }
  - { from: "discord.features.setup_verification", to: "discord.channels.list", relation: "needs_data_from" }
  
  # Risk escalation chains
  - { from: "discord.members.ban", to: "discord.members.get_info", relation: "should_verify_first" }
  - { from: "discord.members.bulk_ban", to: "discord.members.list", relation: "should_verify_first" }
  - { from: "discord.backup.restore", to: "discord.backup.export", relation: "should_backup_first" }

  # Undo/paired actions
