  required_permissions: [create_public_threads]
  risk_level: low

discord.threads.archive:
  description: "Archive a thread (can be unarchived later)"
  required_params:
    thread_id: { type: integer }
  shared_params: {}
  required_permissions: [manage_threads]
  risk_level: low

discord.threads.delete:
  description: "Delete a thread permanently"
  required_params:
    thread_id: { type: integer }
  shared_params: {}
  required_permissions: [manage_threads]
  risk_level: medium

# ============================================================================
# INVITES
# ============================================================================
discord.invites.create:
  description: "Create an invite link for a channel"
  required_params:
    channel_id: { type: integer }
  shared_params:
    max_age: { type: integer, default: 86400, description: "Expiration seconds (0=never)" }
    max_uses: { type: integer, default: 0, description: "Max uses (0=unlimited)" }
    temporary: { type: boolean, default: false, description: "Grant temporary membership" }
  required_permissions: [create_instant_invite]
  risk_level: medium

discord.invites.delete:
  description: "Revoke an invite by code"
  required_params:
    invite_code: { type: string }
  shared_params: {}
  required_permissions: [manage_guild]
  risk_level: medium

discord.invites.list:
  description: "List all active invites in the guild"
  required_params: {}
  shared_params: {}
  required_permissions: [manage_guild]
  risk_level: low

# ============================================================================
# ONBOARDING
# ============================================================================
discord.onboarding.setup_welcome:
  description: "Set up a pinned welcome message in a channel"
  required_params:
    channel_id: { type: integer }
    message: { type: string }
  shared_params: {}
  required_permissions: [send_messages, manage_messages]
  risk_level: low

discord.onboarding.send_dm:
  description: "Send a DM to a member (for onboarding, notifications)"
  required_params:
    member_id: { type: integer }
    message: { type: string }
  shared_params: {}
  required_permissions: []
  risk_level: medium

# ============================================================================
# EVENTS
# ============================================================================
discord.events.create:
  description: "Create a scheduled event (voice, stage, or external)"
  required_params:
    name: { type: string }
    start_time: { type: string, description: "ISO 8601 datetime" }
  shared_params:
    description: { type: string }
    end_time: { type: string, description: "ISO 8601 datetime" }
    entity_type: { type: string, enum: [voice, stage, external], default: "voice" }
    channel_id: { type: integer, description: "Required for voice/stage events" }
    location: { type: string, description: "Required for external events" }
    image_url: { type: string }
  required_permissions: [manage_events]
  risk_level: medium
  graph_edges:
