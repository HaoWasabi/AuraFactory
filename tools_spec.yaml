  shared_params:
    reason: { type: string }
  required_permissions: [manage_webhooks]
  risk_level: medium

discord.webhooks.list:
  description: "List all webhooks in guild or a specific channel"
  required_params: {}
  shared_params:
    channel_id: { type: integer, description: "Filter by channel" }
  required_permissions: [manage_webhooks]
  risk_level: low

# ============================================================================
# THREADS
# ============================================================================
discord.threads.create:
  description: "Create a new thread in a text channel"
