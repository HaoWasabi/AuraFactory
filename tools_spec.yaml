# ============================================================================
# TOOLS_SPEC.yaml — Single Source of Truth for AuraFactory UnifiedAgent v2
# ============================================================================
# This file generates:
#   1. Tool schemas for LLM (MCP ToolDefinition)
#   2. Graph nodes + edges (NetworkX / Neptune)
#   3. Runtime kwargs filter (whitelist)
#
# Convention:
#   - tool names: discord.{module}.{action}
#   - All code + descriptions in English
#   - required_permissions: bot permissions needed (nextcord)
#   - risk_level: low | medium | high | critical
#   - graph_edges: relationships for dependency graph
# ============================================================================

metadata:
  version: "2.0.0"
  project: "AuraFactory"
  description: "Discord Agentic AI — Spec-driven tool registry"
  modules:
    - channels
    - categories
    - roles
    - members
    - guild
    - webhooks
    - threads
    - invites
    - automod
    - onboarding
    - backup
    - features
    - permissions
    - events
    - emojis
    - stickers
    - soundboard
    - audit
    - templates

  # ──────────────────────────────────────────────────────────────────────────
  # LLM Configuration — controls what the agent can "see" and use
  # Adding a new tool to the agent? Just add it here + define it below.
  # ──────────────────────────────────────────────────────────────────────────
  llm_config:
    # Tools the LLM can call via function calling.
    # Format: { short_name: full_mcp_name }
    # short_name = what Gemini sees as function name (concise, no dots)
    # full_mcp_name = actual MCP routing target
    visible_tools:
      create_channel: discord.channels.create
      edit_channel: discord.channels.edit
      delete_channel: discord.channels.delete
      move_channel: discord.channels.move
      create_category: discord.categories.create
      edit_category: discord.categories.edit
      delete_category: discord.categories.delete
      create_role: discord.roles.create
      edit_role: discord.roles.modify
      delete_role: discord.roles.delete
      assign_role: discord.roles.assign
      remove_role: discord.roles.remove
      kick_member: discord.members.kick
      ban_member: discord.members.ban
      timeout_member: discord.members.timeout
      setup_verification: discord.features.setup_verification
      create_poll: discord.features.create_poll
      create_event: discord.events.create
      edit_event: discord.events.edit
      delete_event: discord.events.delete
      create_emoji: discord.emojis.create
      delete_emoji: discord.emojis.delete
      setup_onboarding: discord.onboarding.setup

      set_channel_perms: discord.permissions.set_channel_perms
      set_role_perms: discord.permissions.set_role_perms
      sync_permissions: discord.permissions.sync
      rename_channel: discord.channels.rename
      rename_category: discord.categories.rename
      list_channels: discord.channels.list
      list_categories: discord.categories.list
      list_roles: discord.roles.list
      get_role_info: discord.roles.get_info
      get_guild_info: discord.guild.get_info
      list_members: discord.members.list
      get_member_info: discord.members.get_info
      rename_role: discord.roles.rename
      bulk_create_roles: discord.roles.bulk_create
      set_community: discord.guild.set_community
      set_locale: discord.guild.set_preferred_locale

    # Human-readable labels for confirmation prompts (only high-risk tools need this)
    # If not listed here, auto-generates from description field.
    human_labels:
      discord.channels.delete: "🗑️ Delete channel"
      discord.categories.delete: "🗑️ Delete category"
      discord.roles.delete: "🗑️ Delete role"
      discord.members.kick: "👢 Kick member"
      discord.members.ban: "🔨 Ban member"
      discord.members.bulk_ban: "🔨 Bulk ban members"
      discord.members.timeout: "🔇 Timeout member"
      discord.members.purge: "🗑️ Purge messages"
      discord.backup.restore: "⚠️ Restore full server backup"
      discord.permissions.set_role_perms: "🔐 Modify role permissions"
      discord.community.toggle: "⚠️ Toggle Community mode"
      discord.guild.set_community: "⚠️ Toggle Community feature"
      discord.safety.set_mfa: "⚠️ Change 2FA requirement"

    # Agentic loop settings (overridable via env vars)
    defaults:
      max_iterations: 5
      temperature_planning: 0.2
      temperature_reflect: 0.1
      temperature_assemble: 0.7
      max_tokens_planning: 2048
      max_tokens_reflect: 256
      max_tokens_assemble: 512
      context_max_categories: 20
      context_max_channels: 40
      context_max_roles: 20
      context_history_turns: 6
      approval_ttl_seconds: 300
      rate_limit_burst: 5
      rate_limit_min_delay: 0.5
      retry_max_attempts: 3
      retry_base_delay: 1.0
      confirmation_words: "yes,y,ok,confirm,có,đồng ý,xác nhận,1"

  # ──────────────────────────────────────────────────────────────────────────
  # Parameter Aliases — agent-friendly names → Nextcord/REST names
  # ──────────────────────────────────────────────────────────────────────────
  param_aliases:
    new_name: name
    new_topic: topic
    icon_url: icon
    banner_url: banner
    category_id: parent_id  # REST API uses parent_id

  # ──────────────────────────────────────────────────────────────────────────
  # Rate Limit Profiles — named presets for different operation classes
  # ──────────────────────────────────────────────────────────────────────────
  rate_limit_profiles:
    light_read:
      burst: 10
      min_delay: 0.2
    standard_write:
      burst: 5
      min_delay: 0.5
    heavy_write:
      burst: 3
      min_delay: 1.0
    critical_write:
      burst: 1
      min_delay: 2.0

  # ──────────────────────────────────────────────────────────────────────────
  # Error Taxonomy — typed errors for agent decision-making
  # ──────────────────────────────────────────────────────────────────────────
  error_taxonomy:
    FORBIDDEN:
      retryable: false
      agent_action: "Check bot permissions and role hierarchy"
    HIERARCHY_VIOLATION:
      retryable: false
      agent_action: "Target role is higher than bot role — cannot modify"
    RATE_LIMITED:
      retryable: true
      agent_action: "Wait retry_after seconds then retry"
    NOT_FOUND:
      retryable: false
      agent_action: "Resource does not exist — verify ID with a list call"
    FEATURE_REQUIRED:
      retryable: false
      agent_action: "Server lacks required feature (e.g. COMMUNITY) — inform user"
    INVALID_PARAMS:
      retryable: false
      agent_action: "Fix parameters based on validation error message"

  # ──────────────────────────────────────────────────────────────────────────
  # Blocked Actions — things the bot CANNOT do (API or permission limitation)
  # ──────────────────────────────────────────────────────────────────────────
  blocked_actions:
    - delete_server
    - transfer_ownership
    - add_integration
    - notification_settings_personal
    - per_server_avatar

# ============================================================================
# CHANNELS
# ============================================================================
discord.channels.create:
  description: "Create a new channel in the guild"
  required_params:
    name:
      type: string
      description: "Channel name (2-100 chars, auto-slugified by Discord)"
      validation: { min_length: 1, max_length: 100 }
    type:
      type: string
      description: "Channel type"
      enum: [text, voice, stage, forum, news]
  
  context_params:
    text:
      topic: { type: string, max_length: 1024, description: "Channel topic/description" }
      slowmode_delay: { type: integer, range: [0, 21600], description: "Seconds between user messages" }
      nsfw: { type: boolean, default: false, description: "Age-restricted channel" }
    voice:
      bitrate: { type: integer, range: [8000, 384000], description: "Audio bitrate in bps" }
      user_limit: { type: integer, range: [0, 99], description: "Max users (0=unlimited)" }
      rtc_region: { type: string, description: "Voice region override (null=auto)" }
    stage:
      topic: { type: string, description: "Stage topic (shown in stage instance)" }
      bitrate: { type: integer, range: [8000, 384000] }
      user_limit: { type: integer, range: [0, 10000] }
    forum:
      topic: { type: string, max_length: 4096 }
      slowmode_delay: { type: integer, range: [0, 21600] }
      default_auto_archive_duration: { type: integer, enum: [60, 1440, 4320, 10080] }
    news:
      topic: { type: string, max_length: 1024 }

  shared_params:
    category_id: { type: integer, description: "Parent category ID" }
    position: { type: integer, description: "Channel position in sidebar" }
    reason: { type: string, description: "Audit log reason" }
    is_private:
      type: boolean
      default: false
      description: "Hide channel from @everyone"
    allowed_role_ids:
      type: array
      items: integer
      description: "Role IDs that can access private channel"
      depends_on: { is_private: true }
    allowed_user_ids:
      type: array
      items: integer
      description: "User IDs that can access private channel"
      depends_on: { is_private: true }
    advanced_permissions:
      type: object
      description: "Custom permission overwrites {perm_name: bool}"
      depends_on: { is_private: true }

  required_permissions: [manage_channels]
  risk_level: medium
  graph_edges:
    - { target: "discord.categories.list", relation: "often_preceded_by", reason: "Need category_id" }
    - { target: "discord.roles.list", relation: "often_preceded_by", reason: "Need role IDs for private channel" }
    - { target: "discord.channels.edit", relation: "often_followed_by", reason: "Set additional props after create" }
    - { target: "stage", relation: "requires_feature", feature: "COMMUNITY" }
    - { target: "forum", relation: "requires_feature", feature: "COMMUNITY" }
    - { target: "news", relation: "requires_feature", feature: "COMMUNITY" }

discord.channels.rename:
  description: "Rename an existing channel"
  required_params:
    channel_id: { type: integer, description: "Channel ID to rename" }
    name: { type: string, description: "New channel name (2-100 chars)" }
  shared_params:
    reason: { type: string, description: "Audit log reason" }
  required_permissions: [manage_channels]
  risk_level: medium

discord.channels.edit:
  description: "Edit channel properties. Only provided params are changed."
  required_params:
    channel_id: { type: integer, description: "Target channel ID" }
  
  context_params:
    text:
      name: { type: string }
      topic: { type: string, max_length: 1024 }
      slowmode_delay: { type: integer, range: [0, 21600] }
      nsfw: { type: boolean }
    voice:
      name: { type: string }
      bitrate: { type: integer, range: [8000, 384000] }
      user_limit: { type: integer, range: [0, 99] }
      rtc_region: { type: string }
    stage:
      name: { type: string }
      topic: { type: string }
    forum:
      name: { type: string }
      topic: { type: string }
      slowmode_delay: { type: integer, range: [0, 21600] }
    news:
      name: { type: string }
      topic: { type: string }

  shared_params:
    position: { type: integer }
    category_id: { type: integer, description: "Move to different category" }
    sync_permissions: { type: boolean, default: false, description: "Sync perms with parent category" }
    update_permissions:
      type: object
      description: "Granular permission update for a target"
      properties:
        target_id: { type: integer, description: "Role or member ID" }
        permissions: { type: object, description: "{perm_name: bool}" }
    reason: { type: string }

  required_permissions: [manage_channels]
  risk_level: medium

discord.channels.delete:
  description: "Delete a channel permanently"
  required_params:
    channel_id: { type: integer, description: "Channel to delete" }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_channels]
  risk_level: high
  graph_edges:
    - { target: "discord.channels.list", relation: "often_preceded_by", reason: "Confirm channel exists" }

discord.channels.move:
  description: "Move a channel to a different category or position"
  required_params:
    channel_id: { type: integer }
  shared_params:
    category_id: { type: integer, description: "New parent category" }
    position: { type: integer, description: "New position" }
    sync_permissions: { type: boolean, default: false }
  required_permissions: [manage_channels]
  risk_level: medium

discord.channels.list:
  description: "List all channels in the guild (or filtered by category)"
  required_params: {}
  shared_params:
    category_id: { type: integer, description: "Filter by category" }
    type: { type: string, enum: [text, voice, stage, forum, news, all], description: "Filter by type" }
  required_permissions: [view_channel]
  risk_level: low

# ============================================================================
# CATEGORIES
# ============================================================================
discord.categories.create:
  description: "Create a new category"
  required_params:
    name: { type: string, validation: { min_length: 1, max_length: 100 } }
  shared_params:
    position: { type: integer }
    is_private: { type: boolean, default: false }
    allowed_role_ids:
      type: array
      items: integer
      depends_on: { is_private: true }
    allowed_user_ids:
      type: array
      items: integer
      depends_on: { is_private: true }
    advanced_permissions: { type: object, depends_on: { is_private: true } }
    reason: { type: string }
  required_permissions: [manage_channels]
  risk_level: medium

discord.categories.rename:
  description: "Rename an existing category"
  required_params:
    category_id: { type: integer, description: "Category ID to rename" }
    name: { type: string, description: "New category name" }
  shared_params:
    reason: { type: string, description: "Audit log reason" }
  required_permissions: [manage_channels]
  risk_level: medium

discord.categories.edit:
  description: "Edit category name or permissions"
  required_params:
    category_id: { type: integer }
  shared_params:
    name: { type: string }
    position: { type: integer }
    update_permissions:
      type: object
      properties:
        target_id: { type: integer }
        permissions: { type: object }
    reason: { type: string }
  required_permissions: [manage_channels]
  risk_level: medium

discord.categories.delete:
  description: "Delete a category (channels inside become uncategorized)"
  required_params:
    category_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_channels]
  risk_level: high

discord.categories.sync:
  description: "Sync all child channel permissions with the category"
  required_params:
    category_id: { type: integer }
  shared_params: {}
  required_permissions: [manage_channels]
  risk_level: medium

discord.categories.reorder:
  description: "Reorder categories by providing IDs in desired order"
  required_params:
    category_ids: { type: array, items: integer, description: "Category IDs in desired order" }
  shared_params: {}
  required_permissions: [manage_channels]
  risk_level: medium

discord.categories.list:
  description: "List all categories with their child channels"
  required_params: {}
  shared_params: {}
  required_permissions: [view_channel]
  risk_level: low

# ============================================================================
# ROLES
# ============================================================================
discord.roles.create:
  description: "Create a new role with full attribute control"
  required_params:
    name: { type: string, validation: { min_length: 1, max_length: 100 } }
  shared_params:
    color: { type: string, description: "Hex color string '#ff0000' or integer" }
    hoist: { type: boolean, default: false, description: "Show separately in member list" }
    mentionable: { type: boolean, default: false, description: "Allow @mention" }
    permissions: { type: object, description: "{permission_name: bool}" }
    position: { type: integer }
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: medium
  graph_edges:
    - { target: "discord.roles.assign", relation: "often_followed_by" }

discord.roles.bulk_create:
  description: "Create multiple roles at once (batch operation)"
  required_params:
    roles:
      type: array
      items: object
      description: "List of role definitions. Each: {name, color?, hoist?, mentionable?, permissions?}"
  shared_params:
    reason: { type: string, description: "Audit log reason" }
  required_permissions: [manage_roles]
  risk_level: medium
  constraints:
    - "Each role must have a 'name' field"
    - "Max 25 roles per call recommended (Discord rate limits)"
  graph_edges:
    - { target: "discord.roles.assign", relation: "often_followed_by" }
    - { target: "discord.roles.batch_assign", relation: "often_followed_by" }

discord.roles.rename:
  description: "Rename an existing role"
  required_params:
    role_id: { type: integer, description: "Role ID to rename" }
    name: { type: string, description: "New role name" }
  shared_params:
    reason: { type: string, description: "Audit log reason" }
  required_permissions: [manage_roles]
  risk_level: medium

discord.roles.modify:
  description: "Edit role attributes. Permissions are MERGED (not replaced)."
  required_params:
    role_id: { type: integer }
  shared_params:
    name: { type: string }
    color: { type: string }
    hoist: { type: boolean }
    mentionable: { type: boolean }
    permissions: { type: object, description: "Partial — only listed keys change" }
    position: { type: integer }
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: medium
  constraints:
    - "Cannot modify roles at or above bot's highest role"

discord.roles.delete:
  description: "Delete a role from the guild"
  required_params:
    role_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: high
  constraints:
    - "Cannot delete @everyone or roles above bot"

discord.roles.assign:
  description: "Assign a role to a member"
  required_params:
    member_id: { type: integer }
    role_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: medium
  graph_edges:
    - { target: "discord.roles.list", relation: "often_preceded_by" }
    - { target: "discord.members.list", relation: "often_preceded_by" }

discord.roles.remove:
  description: "Remove a role from a member"
  required_params:
    member_id: { type: integer }
    role_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: medium

discord.roles.batch_assign:
  description: "Assign or remove a role to/from multiple members at once"
  required_params:
    role_id: { type: integer }
    member_ids: { type: array, items: integer }
  shared_params:
    action: { type: string, enum: [add, remove], default: "add" }
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: high

discord.roles.clone:
  description: "Clone a role — copy all attributes (color, perms, hoist, mentionable)"
  required_params:
    source_role_id: { type: integer }
    new_name: { type: string }
  shared_params:
    reason: { type: string }
  required_permissions: [manage_roles]
  risk_level: medium

discord.roles.set_position:
  description: "Change a role's hierarchy position"
  required_params:
    role_id: { type: integer }
    position: { type: integer }
  shared_params: {}
  required_permissions: [manage_roles]
  risk_level: high
  constraints:
    - "Cannot move role above bot's highest role"

discord.roles.list:
  description: "List all roles in the guild with permissions info"
  required_params: {}
  shared_params: {}
  required_permissions: []
  risk_level: low

discord.roles.get_info:
  description: "Get detailed info about a specific role"
  required_params:
    role_id: { type: integer }
  shared_params: {}
  required_permissions: []
  risk_level: low

# ============================================================================
# MEMBERS
# ============================================================================
discord.members.kick:
  description: "Kick a member from the guild (they can rejoin via invite)"
  required_params:
    member_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [kick_members]
  risk_level: high

discord.members.ban:
  description: "Ban a member from the guild (cannot rejoin unless unbanned)"
  required_params:
    member_id: { type: integer }
  shared_params:
    reason: { type: string }
    delete_message_seconds: { type: integer, range: [0, 604800], description: "Delete messages from last N seconds (max 7 days)" }
  required_permissions: [ban_members]
  risk_level: critical

discord.members.unban:
  description: "Unban a previously banned user"
  required_params:
    user_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [ban_members]
  risk_level: medium

discord.members.bulk_ban:
  description: "Ban multiple members at once"
  required_params:
    member_ids: { type: array, items: integer, validation: { max_items: 200 } }
  shared_params:
    delete_message_seconds: { type: integer, range: [0, 604800] }
    reason: { type: string }
  required_permissions: [ban_members]
  risk_level: critical

discord.members.timeout:
  description: "Timeout a member (disable communication temporarily)"
  required_params:
    member_id: { type: integer }
    duration_minutes: { type: integer, range: [1, 40320], description: "Timeout duration (max 28 days)" }
  shared_params:
    reason: { type: string }
  required_permissions: [moderate_members]
  risk_level: high

discord.members.mute:
  description: "Server-mute a member in voice channels"
  required_params:
    member_id: { type: integer }
  shared_params:
    reason: { type: string }
  required_permissions: [mute_members]
  risk_level: medium

discord.members.purge:
  description: "Delete messages in a channel (optionally by a specific member)"
  required_params:
    channel_id: { type: integer }
  shared_params:
    limit: { type: integer, range: [1, 100], default: 10, description: "Number of messages to delete" }
    member_id: { type: integer, description: "Only delete messages from this member" }
  required_permissions: [manage_messages]
  risk_level: high

discord.members.list:
  description: "List all members in the guild"
  required_params: {}
  shared_params: {}
  required_permissions: []
  risk_level: low

discord.members.get_info:
  description: "Get detailed info about a member (roles, permissions, join date)"
  required_params:
    member_id: { type: integer }
  shared_params: {}
  required_permissions: []
  risk_level: low

# ============================================================================
# GUILD
# ============================================================================
discord.guild.get_info:
  description: "Get full guild snapshot — identity, stats, features, settings"
  required_params: {}
  shared_params: {}
  required_permissions: []
  risk_level: low

discord.guild.edit_profile:
  description: "Batch-edit server profile fields (name, icon, banner, etc.)"
  required_params: {}
  shared_params:
    name: { type: string, validation: { min_length: 2, max_length: 100 } }
    description: { type: string }
    icon_url: { type: string, description: "URL of new icon (empty string to clear)" }
    banner_url: { type: string, description: "URL of new banner (requires Boost Level 2+)" }
    splash_url: { type: string, description: "Invite splash image URL" }
    verification_level: { type: string, enum: [none, low, medium, high, highest] }
    explicit_content_filter: { type: string, enum: [disabled, no_role, all_members] }
    preferred_locale: { type: string, description: "IETF locale tag (en-US, vi, ja)" }
  required_permissions: [manage_guild]
  risk_level: high
  graph_edges:
    - { target: "discord.guild.get_info", relation: "often_preceded_by", reason: "Check current settings" }

discord.guild.set_community:
  description: "Enable or disable the Community feature on the server. Required for stage/news/forum channels."
  required_params:
    enable:
      type: boolean
      description: "True to enable Community, False to disable"
  shared_params:
    rules_channel_id:
      type: integer
      description: "Text channel to use as #rules (required by Discord when enabling)"
    updates_channel_id:
      type: integer
      description: "Text channel for public updates/announcements"
  required_permissions: [manage_guild]
  risk_level: high
  constraints:
    - "Enabling Community requires at least one text channel"
    - "Discord will set minimum verification_level to 'low' when enabling"
  graph_edges:
    - { target: "discord.channels.list", relation: "often_preceded_by", reason: "Need channel IDs" }

discord.guild.set_preferred_locale:
  description: "Set the server's preferred language/locale"
  required_params:
    locale:
      type: string
      description: "IETF locale tag (e.g. en-US, vi, ja, ko, zh-CN, fr, de, es-ES, pt-BR)"
  shared_params: {}
  required_permissions: [manage_guild]
  risk_level: low

discord.guild.set_verification:
  description: "Change verification level"
  required_params:
    level: { type: string, enum: [none, low, medium, high, highest] }
