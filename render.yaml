# render.yaml — Render.com deploy config (free tier)
services:
  - type: web
    name: aurafactory
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: ALLOWED_GUILD_IDS
        value: all
      - key: PORT
        value: 8000
    healthCheckPath: /health
